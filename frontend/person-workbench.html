<!doctype html>
<html lang="zh-CN" data-visual="archive" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="Bangumi Staff Statistics 人物排行与共同参与分析静态原型" />
		<title>人物工作台 · Bangumi Staff Statistics</title>
		<script>
			try {
				const requestedTheme = new URLSearchParams(window.location.search).get('theme')
				const storedTheme = window.localStorage.getItem('bgmss-workbench-theme')
				const theme = requestedTheme === 'dark' || requestedTheme === 'light'
					? requestedTheme
					: storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light'
				document.documentElement.dataset.theme = theme
				document.documentElement.style.colorScheme = theme
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/workbench/main.ts"></script>
	</body>
</html>
