<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Bangumi Staff Statistics 十色分类调色盘实验工具" />
	<meta name="theme-color" content="#f5f5f7" />
	<title>十色调色盘实验室 · Bangumi Staff Statistics</title>
	<style>
		:root {
			color-scheme: light;
			--font-ui: "Source Han Sans SC VF", "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", sans-serif;
			--canvas: oklch(0.965 0.004 330);
			--surface: oklch(0.995 0.002 330);
			--surface-subtle: oklch(0.975 0.006 330);
			--surface-sunken: oklch(0.945 0.006 315);
			--hover: oklch(0.94 0.014 350);
			--pressed: oklch(0.915 0.018 350);
			--border: oklch(0.86 0.009 320);
			--divider: oklch(0.925 0.006 320);
			--control-border: oklch(0.65 0.012 320);
			--text-1: oklch(0.24 0.015 285);
			--text-2: oklch(0.34 0.014 285);
			--text-3: oklch(0.47 0.015 285);
			--disabled: oklch(0.62 0.01 300);
			--primary: #C82A70;
			--primary-hover: #D23978;
			--primary-pressed: #AD215F;
			--primary-soft: color-mix(in oklab, var(--primary) 8%, var(--surface));
			--focus: var(--primary);
			--on-primary: #fff;
			--success: oklch(0.43 0.12 160);
			--warning: oklch(0.43 0.09 80);
			--error: oklch(0.48 0.18 25);
			--radius-card: 8px;
			--radius-control: 6px;
			--space-1: 4px;
			--space-2: 8px;
			--space-3: 12px;
			--space-4: 16px;
			--space-5: 20px;
			--space-6: 24px;
			--shadow: 0 1px 2px oklch(0.2 0.01 285 / 0.06);
			font-family: var(--font-ui);
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--canvas: oklch(0.16 0.008 280);
			--surface: oklch(0.205 0.01 280);
			--surface-subtle: oklch(0.235 0.012 280);
			--surface-sunken: oklch(0.18 0.009 280);
			--hover: oklch(0.27 0.012 280);
			--pressed: oklch(0.3 0.015 280);
			--border: oklch(0.33 0.012 280);
			--divider: oklch(0.275 0.011 280);
			--control-border: oklch(0.51 0.012 280);
			--text-1: oklch(0.95 0.006 280);
			--text-2: oklch(0.82 0.01 280);
			--text-3: oklch(0.69 0.012 280);
			--disabled: oklch(0.52 0.01 280);
			--primary: #F16A9C;
			--primary-hover: #FC85AF;
			--primary-pressed: #DA578A;
			--primary-soft: color-mix(in oklab, var(--primary) 20%, var(--surface));
			--focus: var(--primary-hover);
			--on-primary: #17171B;
			--success: oklch(0.68 0.13 160);
			--warning: oklch(0.75 0.11 80);
			--error: oklch(0.72 0.16 25);
			--shadow: none;
		}

		* { box-sizing: border-box; }

		html { min-width: 320px; background: var(--canvas); }

		body {
			min-height: 100vh;
			margin: 0;
			background: var(--canvas);
			color: var(--text-1);
			font-size: 14px;
			line-height: 1.5;
		}

		button,
		input,
		select,
		textarea { font: inherit; }

		button,
		input,
		select,
		textarea { color: inherit; }

		button { cursor: pointer; }

		button:focus-visible,
		input:focus-visible,
		select:focus-visible,
		textarea:focus-visible,
		[tabindex]:focus-visible {
			outline: 3px solid color-mix(in oklab, var(--focus) 34%, transparent);
			outline-offset: 2px;
		}

		.app-header {
			position: sticky;
			top: 0;
			z-index: 20;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--space-4);
			min-height: 58px;
			padding: 10px max(16px, calc((100vw - 1480px) / 2));
			border-top: 3px solid var(--primary);
			border-bottom: 1px solid var(--border);
			background: color-mix(in oklab, var(--surface) 92%, transparent);
			backdrop-filter: blur(16px) saturate(135%);
		}

		.brand { min-width: 0; }

		.brand h1 {
			margin: 0;
			font-size: 18px;
			line-height: 1.25;
			letter-spacing: -0.01em;
			text-wrap: balance;
		}

		.brand p {
			margin: 2px 0 0;
			color: var(--text-3);
			font-size: 12px;
			text-wrap: pretty;
		}

		.header-actions,
		.inline-actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: var(--space-2);
		}

		.control,
		.button {
			min-height: 36px;
			border-radius: var(--radius-control);
		}

		.control {
			border: 1px solid var(--control-border);
			background: var(--surface);
		}

		select.control,
		input.control,
		textarea.control { padding: 7px 10px; }

		.button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			padding: 7px 11px;
			border: 1px solid var(--control-border);
			background: var(--surface);
			color: var(--text-2);
			font-weight: 600;
			transition: background-color 160ms ease-out, border-color 160ms ease-out, transform 120ms ease-out;
		}

		.button:hover { background: var(--hover); }
		.button:active { transform: translateY(1px); background: var(--pressed); }
		.button:disabled { cursor: not-allowed; color: var(--disabled); opacity: .62; transform: none; }

		.button--primary {
			border-color: var(--primary);
			background: var(--primary);
			color: var(--on-primary);
		}

		.button--primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
		.button--primary:active { border-color: var(--primary-pressed); background: var(--primary-pressed); }

		.button--icon {
			width: 36px;
			padding: 0;
			font-size: 18px;
		}

		main {
			width: min(1480px, calc(100% - 32px));
			margin: var(--space-5) auto 48px;
		}

		.workspace {
			overflow: hidden;
			border: 1px solid var(--border);
			border-radius: var(--radius-card);
			background: var(--surface);
			box-shadow: var(--shadow);
		}

		.palette-overview {
			padding: var(--space-5);
			border-bottom: 1px solid var(--divider);
		}

		.section-heading {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: var(--space-4);
			margin-bottom: var(--space-4);
		}

		.section-heading h2,
		.panel-heading h2 {
			margin: 0;
			font-size: 16px;
			line-height: 1.35;
			text-wrap: balance;
		}

		.section-heading p,
		.panel-heading p {
			max-width: 72ch;
			margin: 3px 0 0;
			color: var(--text-3);
			font-size: 12px;
			text-wrap: pretty;
		}

		.palette-list {
			display: grid;
			grid-template-columns: repeat(10, minmax(86px, 1fr));
			gap: 1px;
			overflow: hidden;
			border: 1px solid var(--border);
			border-radius: var(--radius-control);
			background: var(--border);
		}

		.swatch-card {
			position: relative;
			display: grid;
			grid-template-rows: 72px auto;
			min-width: 0;
			padding: 0;
			border: 0;
			background: var(--surface);
			text-align: left;
		}

		.swatch-card::after {
			position: absolute;
			inset: 0;
			border: 2px solid transparent;
			border-radius: 5px;
			content: "";
			pointer-events: none;
		}

		.swatch-card:hover::after { border-color: color-mix(in oklab, var(--primary) 36%, transparent); }
		.swatch-card.is-selected::after { border-color: var(--primary); }

		.swatch-color { display: block; width: 100%; height: 100%; }

		.swatch-meta {
			display: grid;
			gap: 1px;
			min-width: 0;
			padding: 9px 8px 10px;
		}

		.swatch-meta b,
		.swatch-meta span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.swatch-meta b { font-size: 12px; }
		.swatch-meta span { color: var(--text-3); font: 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace; }

		.workspace-grid {
			display: grid;
			grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
			min-height: 660px;
		}

		.editor-panel,
		.preview-panel { min-width: 0; padding: var(--space-5); }
		.editor-panel { border-right: 1px solid var(--divider); background: var(--surface-subtle); }

		.panel-heading { margin-bottom: var(--space-5); }

		.color-hero {
			display: grid;
			grid-template-columns: 82px minmax(0, 1fr);
			align-items: stretch;
			gap: var(--space-3);
			margin-bottom: var(--space-5);
		}

		.native-picker {
			position: relative;
			overflow: hidden;
			min-height: 82px;
			border: 1px solid var(--control-border);
			border-radius: var(--radius-control);
		}

		.native-picker input {
			position: absolute;
			inset: -12px;
			width: calc(100% + 24px);
			height: calc(100% + 24px);
			padding: 0;
			border: 0;
			cursor: pointer;
		}

		.color-identity { display: grid; gap: var(--space-2); min-width: 0; }
		.field { display: grid; gap: 5px; min-width: 0; }

		.field > span,
		.range-heading span {
			color: var(--text-3);
			font-size: 12px;
			font-weight: 600;
		}

		.field input,
		.field textarea { width: 100%; min-width: 0; }

		.hex-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); }

		.range-stack {
			display: grid;
			gap: var(--space-4);
			padding: var(--space-4) 0;
			border-top: 1px solid var(--divider);
			border-bottom: 1px solid var(--divider);
		}

		.range-field { display: grid; gap: 7px; }

		.range-heading {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: var(--space-3);
		}

		.range-heading output {
			font: 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
			font-variant-numeric: tabular-nums;
		}

		input[type="range"] {
			width: 100%;
			margin: 0;
			accent-color: var(--primary);
		}

		.contrast-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: var(--space-2);
			margin: var(--space-5) 0;
		}

		.contrast-sample {
			display: grid;
			gap: 4px;
			min-width: 0;
			padding: 10px;
			border-radius: var(--radius-control);
			font-size: 12px;
		}

		.contrast-sample b { font-size: 14px; font-variant-numeric: tabular-nums; }
		.contrast-sample span { opacity: .8; }

		.order-tools { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }

		.preview-toolbar {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--space-4);
			margin-bottom: var(--space-5);
		}

		.preview-toolbar .field { min-width: min(220px, 100%); }

		.quality-strip {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 1px;
			overflow: hidden;
			margin-bottom: var(--space-5);
			border: 1px solid var(--border);
			border-radius: var(--radius-control);
			background: var(--border);
		}

		.quality-item { min-width: 0; padding: 11px 12px; background: var(--surface); }
		.quality-item span { display: block; color: var(--text-3); font-size: 11px; }
		.quality-item b { display: block; overflow: hidden; margin-top: 2px; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
		.quality-item.is-good b { color: var(--success); }
		.quality-item.is-watch b { color: var(--warning); }
		.quality-item.is-risk b { color: var(--error); }

		.preview-canvas {
			display: grid;
			grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr);
			gap: var(--space-4);
			padding: var(--space-4);
			border: 1px solid var(--border);
			border-radius: var(--radius-card);
			background: var(--preview-bg, #fff);
			color: var(--preview-text, #1f2225);
			transition: background-color 180ms ease-out, color 180ms ease-out;
		}

		.preview-main,
		.preview-side { display: grid; align-content: start; gap: var(--space-4); min-width: 0; }

		.preview-module {
			min-width: 0;
			padding: var(--space-4);
			border: 1px solid var(--preview-border, #e0e0e6);
			border-radius: var(--radius-card);
			background: var(--preview-surface, #fff);
		}

		.preview-module h3 { margin: 0 0 2px; font-size: 14px; }
		.preview-module p { margin: 0 0 var(--space-3); color: var(--preview-muted, #646a70); font-size: 12px; }

		.chart-wrap { position: relative; min-height: 240px; }
		.chart-wrap svg { display: block; width: 100%; height: 240px; overflow: visible; }
		.chart-grid { stroke: var(--preview-border, #e0e0e6); stroke-width: 1; }
		.chart-label { fill: var(--preview-muted, #646a70); font: 10px var(--font-ui); }
		.chart-line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.25; }
		.chart-dot { stroke: var(--preview-surface, #fff); stroke-width: 1.5; }

		.bar-chart {
			display: grid;
			grid-template-columns: repeat(10, minmax(12px, 1fr));
			align-items: end;
			gap: 5px;
			height: 190px;
			padding-top: 8px;
			border-bottom: 1px solid var(--preview-border, #e0e0e6);
		}

		.bar { position: relative; min-height: 8px; border-radius: 3px 3px 0 0; }
		.bar::after { position: absolute; right: 0; bottom: -22px; left: 0; color: var(--preview-muted, #646a70); font: 10px/1 var(--font-ui); text-align: center; content: attr(data-index); }

		.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 10px; }
		.legend-item { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; }
		.legend-item i { flex: 0 0 10px; width: 10px; height: 10px; border-radius: 2px; }
		.legend-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

		.stack { display: flex; overflow: hidden; height: 18px; border-radius: 4px; }
		.stack i { min-width: 3px; height: 100%; }

		.matrix { display: grid; grid-template-columns: repeat(10, minmax(17px, 1fr)); gap: 3px; }
		.matrix i { aspect-ratio: 1; border-radius: 3px; }

		.export-panel {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: var(--space-2);
			margin-top: var(--space-5);
		}

		.export-panel textarea {
			min-height: 154px;
			resize: vertical;
			font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
		}

		.export-actions { display: grid; align-content: start; gap: var(--space-2); }

		dialog {
			width: min(560px, calc(100% - 32px));
			padding: 0;
			border: 1px solid var(--border);
			border-radius: var(--radius-card);
			background: var(--surface);
			color: var(--text-1);
			box-shadow: 0 16px 48px oklch(0.1 0.01 285 / .22);
		}

		dialog::backdrop { background: oklch(0.1 0.01 285 / .52); }
		.dialog-body { padding: var(--space-5); }
		.dialog-body h2 { margin: 0 0 4px; font-size: 18px; }
		.dialog-body p { margin: 0 0 var(--space-4); color: var(--text-3); font-size: 13px; }
		.dialog-body textarea { width: 100%; min-height: 230px; resize: vertical; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
		.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }

		.toast {
			position: fixed;
			right: 18px;
			bottom: 18px;
			z-index: 50;
			max-width: min(360px, calc(100% - 36px));
			padding: 10px 13px;
			border: 1px solid color-mix(in oklab, var(--primary) 28%, var(--border));
			border-radius: var(--radius-control);
			background: var(--surface);
			color: var(--text-1);
			box-shadow: 0 6px 16px oklch(0.1 0.01 285 / .14);
			font-size: 13px;
			transition: opacity 160ms ease-out, transform 160ms ease-out;
		}

		.toast[hidden] { display: block; opacity: 0; transform: translateY(8px); pointer-events: none; }

		@media (max-width: 1120px) {
			.palette-list { grid-template-columns: repeat(5, minmax(96px, 1fr)); }
			.preview-canvas { grid-template-columns: 1fr; }
		}

		@media (max-width: 760px) {
			.app-header { position: static; align-items: flex-start; padding-inline: 16px; }
			.brand p { display: none; }
			.header-actions { justify-content: flex-end; }
			main { width: min(100% - 20px, 1480px); margin-top: 10px; }
			.palette-overview,
			.editor-panel,
			.preview-panel { padding: var(--space-4); }
			.section-heading,
			.preview-toolbar { align-items: stretch; flex-direction: column; }
			.palette-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
			.swatch-card { grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: 58px; }
			.workspace-grid { grid-template-columns: 1fr; }
			.editor-panel { border-right: 0; border-bottom: 1px solid var(--divider); }
			.quality-strip { grid-template-columns: 1fr; }
			.export-panel { grid-template-columns: 1fr; }
			.export-actions { grid-template-columns: repeat(3, 1fr); }
		}

		@media (max-width: 480px) {
			.app-header { display: grid; }
			.header-actions { justify-content: flex-start; }
			.header-actions .button { padding-inline: 9px; font-size: 12px; }
			.color-hero { grid-template-columns: 64px minmax(0, 1fr); }
			.legend { grid-template-columns: 1fr; }
			.contrast-grid { grid-template-columns: 1fr; }
			.export-actions { grid-template-columns: 1fr; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<header class="app-header">
		<div class="brand">
			<h1>十色调色盘实验室</h1>
			<p>为人物、系列和分类数据建立同色位的 Light / Dark 双主题颜色。</p>
		</div>
		<div class="header-actions" aria-label="全局工具">
			<button class="button button--icon" id="undoButton" type="button" title="撤销" aria-label="撤销">↶</button>
			<button class="button button--icon" id="redoButton" type="button" title="恢复" aria-label="恢复">↷</button>
			<button class="button" id="importButton" type="button"><span>导入</span></button>
			<button class="button" id="resetButton" type="button"><span>恢复候选</span></button>
			<button class="button button--primary" id="copyAllButton" type="button"><span>复制调色盘</span></button>
		</div>
	</header>

	<main>
		<div class="workspace">
			<section class="palette-overview" aria-labelledby="paletteTitle">
				<div class="section-heading">
					<div>
						<h2 id="paletteTitle">双主题固定顺序 · 10 色</h2>
						<p>Light / Dark 共用色位、名称和色相方向；第一色分别锚定当前主题主色。切换右侧主题即可编辑对应色盘。</p>
					</div>
					<div class="inline-actions">
						<label class="field">
							<span>色觉预览</span>
							<select class="control" id="visionSelect">
								<option value="normal">标准视觉</option>
								<option value="protanopia">红色盲模拟</option>
								<option value="deuteranopia">绿色盲模拟</option>
								<option value="tritanopia">蓝色盲模拟</option>
								<option value="achromatopsia">全色盲模拟</option>
							</select>
						</label>
					</div>
				</div>
				<div class="palette-list" id="paletteList" role="listbox" aria-label="十色调色盘"></div>
			</section>

			<div class="workspace-grid">
				<aside class="editor-panel" aria-labelledby="editorTitle">
					<div class="panel-heading">
						<h2 id="editorTitle">编辑颜色 <span id="selectedNumber"></span></h2>
						<p>颜色以 OKLCH 为主编辑空间，修改时自动转回可用的 sRGB HEX。</p>
					</div>

					<div class="color-hero">
						<label class="native-picker" title="打开系统选色器">
							<input id="nativeColor" type="color" aria-label="打开系统选色器" />
						</label>
						<div class="color-identity">
							<label class="field">
								<span>名称</span>
								<input class="control" id="nameInput" type="text" maxlength="28" autocomplete="off" />
							</label>
							<label class="field">
								<span>HEX</span>
								<span class="hex-row">
									<input class="control" id="hexInput" type="text" maxlength="7" spellcheck="false" autocomplete="off" />
									<button class="button button--icon" id="copyColorButton" type="button" title="复制当前 HEX" aria-label="复制当前 HEX">⧉</button>
								</span>
							</label>
						</div>
					</div>

					<div class="range-stack">
						<label class="range-field">
							<span class="range-heading"><span>明度 L</span><output id="lightnessOutput"></output></span>
							<input id="lightnessRange" type="range" min="0" max="100" step="0.1" />
						</label>
						<label class="range-field">
							<span class="range-heading"><span>彩度 C</span><output id="chromaOutput"></output></span>
							<input id="chromaRange" type="range" min="0" max="0.34" step="0.001" />
						</label>
						<label class="range-field">
							<span class="range-heading"><span>色相 H</span><output id="hueOutput"></output></span>
							<input id="hueRange" type="range" min="0" max="360" step="0.1" />
						</label>
					</div>

					<div class="contrast-grid" id="contrastGrid" aria-label="当前颜色对比度"></div>

					<div class="order-tools">
						<button class="button" id="moveLeftButton" type="button">向前移动</button>
						<button class="button" id="moveRightButton" type="button">向后移动</button>
					</div>
				</aside>

				<section class="preview-panel" aria-labelledby="previewTitle">
					<div class="preview-toolbar">
						<div class="panel-heading">
							<h2 id="previewTitle">多颜色场景预览</h2>
							<p>同时检查折线、分组柱、堆叠、图例与密集矩阵；模拟模式只影响预览，不会改写原始色值。</p>
						</div>
						<label class="field">
							<span>编辑与预览主题</span>
							<select class="control" id="surfaceSelect">
								<option value="light">浅色工作台</option>
								<option value="dark">深色工作台</option>
							</select>
						</label>
					</div>

					<div class="quality-strip" id="qualityStrip" aria-live="polite"></div>
					<div class="preview-canvas" id="previewCanvas"></div>

					<div class="export-panel">
						<label class="field">
							<span>应用草案</span>
							<textarea class="control" id="exportOutput" readonly spellcheck="false"></textarea>
						</label>
						<div class="export-actions">
							<button class="button" id="formatButton" type="button">切换 JSON</button>
							<button class="button" id="copyOutputButton" type="button">复制</button>
							<button class="button" id="downloadButton" type="button">下载</button>
						</div>
					</div>
				</section>
			</div>
		</div>
	</main>

	<dialog id="importDialog">
		<form method="dialog" class="dialog-body" id="importForm">
			<h2>导入调色盘</h2>
			<p>接受当前主题的 10 色 HEX 数组，或包含 Light / Dark 两套色盘的工具导出 JSON。</p>
			<textarea class="control" id="importInput" spellcheck="false" placeholder='{"palettes":{"light":[...],"dark":[...]}}'></textarea>
			<div class="dialog-actions">
				<button class="button" value="cancel" type="button" id="cancelImportButton">取消</button>
				<button class="button button--primary" value="default" type="submit">导入并预览</button>
			</div>
		</form>
	</dialog>

	<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

	<script>
		(() => {
			'use strict';

			const STORAGE_KEY = 'bgmss-palette-lab-v3';
			const PALETTE_NAMES = ['系列粉', '青绿色', '珊瑚红', '鸢尾紫', '赭金', '叶绿', '晴空蓝', '靛蓝', '灰玫瑰', '杏橙'];
			const INITIAL_PALETTES = {
				light: ['#C82A70', '#288183', '#C05852', '#916FC8', '#A07703', '#579459', '#368FC4', '#5B62AB', '#D96D92', '#C97F4E'],
				dark: ['#F16A9C', '#61A8AA', '#EF8E86', '#BEA0F2', '#D2AB59', '#87BD87', '#6FB7E9', '#8992D6', '#FFA9C3', '#FDB78C'],
			};

			const state = {
				palettes: loadPalettes(),
				selected: 0,
				vision: 'normal',
				surface: 'light',
				format: 'css',
				history: [],
				future: [],
			};

			const $ = (selector) => document.querySelector(selector);
			const paletteList = $('#paletteList');
			const previewCanvas = $('#previewCanvas');
			const toast = $('#toast');
			let toastTimer = 0;
			let rangeEditStart = null;

			function clonePalette(palette) {
				return palette.map((color) => ({ ...color }));
			}

			function createPalette(colors, names = PALETTE_NAMES) {
				return colors.map((hex, index) => ({ name: names[index] || PALETTE_NAMES[index], hex }));
			}

			function clonePalettes(palettes) {
				return { light: clonePalette(palettes.light), dark: clonePalette(palettes.dark) };
			}

			function normalizePalette(source, fallback) {
				if (!Array.isArray(source) || source.length !== 10) return null;
				const palette = source.map((item, index) => ({
					name: String((typeof item === 'string' ? '' : item.name) || fallback[index].name).slice(0, 28),
					hex: normalizeHex(typeof item === 'string' ? item : item.hex),
				}));
				return palette.every((item) => item.hex) ? palette : null;
			}

			function loadPalettes() {
				const initial = {
					light: createPalette(INITIAL_PALETTES.light),
					dark: createPalette(INITIAL_PALETTES.dark),
				};
				try {
					const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
					const light = normalizePalette(saved?.light, initial.light);
					const dark = normalizePalette(saved?.dark, initial.dark);
					if (light && dark) return { light, dark };
				} catch {}
				return clonePalettes(initial);
			}

			function currentPalette() {
				return state.palettes[state.surface];
			}

			function normalizeHex(value) {
				const match = String(value || '').trim().match(/^#?([0-9a-f]{6})$/i);
				return match ? `#${match[1].toUpperCase()}` : null;
			}

			function hexToRgb(hex) {
				const value = parseInt(normalizeHex(hex).slice(1), 16);
				return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
			}

			function rgbToHex({ r, g, b }) {
				const channel = (value) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
				return `#${channel(r)}${channel(g)}${channel(b)}`.toUpperCase();
			}

			function srgbToLinear(value) {
				const channel = value / 255;
				return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
			}

			function linearToSrgb(value) {
				const channel = value <= 0.0031308 ? 12.92 * value : 1.055 * Math.pow(value, 1 / 2.4) - 0.055;
				return Math.max(0, Math.min(1, channel)) * 255;
			}

			function rgbToOklab(hex) {
				const rgb = hexToRgb(hex);
				const r = srgbToLinear(rgb.r);
				const g = srgbToLinear(rgb.g);
				const b = srgbToLinear(rgb.b);
				const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
				const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
				const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
				return {
					L: 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
					a: 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
					b: 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
				};
			}

			function hexToOklch(hex) {
				const lab = rgbToOklab(hex);
				const C = Math.hypot(lab.a, lab.b);
				let H = Math.atan2(lab.b, lab.a) * 180 / Math.PI;
				if (H < 0) H += 360;
				return { L: lab.L, C, H: Number.isFinite(H) ? H : 0 };
			}

			function oklchToHex({ L, C, H }) {
				const radians = H * Math.PI / 180;
				const a = C * Math.cos(radians);
				const b = C * Math.sin(radians);
				const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
				const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
				const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * b, 3);
				return rgbToHex({
					r: linearToSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
					g: linearToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
					b: linearToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s),
				});
			}

			function relativeLuminance(hex) {
				const { r, g, b } = hexToRgb(hex);
				return 0.2126 * srgbToLinear(r) + 0.7152 * srgbToLinear(g) + 0.0722 * srgbToLinear(b);
			}

			function contrastRatio(a, b) {
				const first = relativeLuminance(a);
				const second = relativeLuminance(b);
				return (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);
			}

			function deltaE(a, b) {
				const first = rgbToOklab(a);
				const second = rgbToOklab(b);
				return Math.hypot(first.L - second.L, first.a - second.a, first.b - second.b) * 100;
			}

			function simulatedHex(hex) {
				if (state.vision === 'normal') return hex;
				const matrices = {
					protanopia: [[.56667, .43333, 0], [.55833, .44167, 0], [0, .24167, .75833]],
					deuteranopia: [[.625, .375, 0], [.7, .3, 0], [0, .3, .7]],
					tritanopia: [[.95, .05, 0], [0, .433, .567], [0, .475, .525]],
					achromatopsia: [[.299, .587, .114], [.299, .587, .114], [.299, .587, .114]],
				};
				const matrix = matrices[state.vision];
				const { r, g, b } = hexToRgb(hex);
				return rgbToHex({
					r: matrix[0][0] * r + matrix[0][1] * g + matrix[0][2] * b,
					g: matrix[1][0] * r + matrix[1][1] * g + matrix[1][2] * b,
					b: matrix[2][0] * r + matrix[2][1] * g + matrix[2][2] * b,
				});
			}

			function snapshot() {
				return JSON.stringify(state.palettes);
			}

			function commit(previous) {
				const current = snapshot();
				if (previous !== current) {
					state.history.push(previous);
					if (state.history.length > 60) state.history.shift();
					state.future = [];
					localStorage.setItem(STORAGE_KEY, current);
				}
				render();
			}

			function mutate(callback) {
				const previous = snapshot();
				callback();
				commit(previous);
			}

			function undo() {
				if (!state.history.length) return;
				state.future.push(snapshot());
				state.palettes = JSON.parse(state.history.pop());
				localStorage.setItem(STORAGE_KEY, snapshot());
				render();
			}

			function redo() {
				if (!state.future.length) return;
				state.history.push(snapshot());
				state.palettes = JSON.parse(state.future.pop());
				localStorage.setItem(STORAGE_KEY, snapshot());
				render();
			}

			function showToast(message) {
				clearTimeout(toastTimer);
				toast.textContent = message;
				toast.hidden = false;
				toastTimer = setTimeout(() => { toast.hidden = true; }, 1800);
			}

			async function copyText(value, label = '已复制') {
				try {
					await navigator.clipboard.writeText(value);
					showToast(label);
				} catch {
					$('#exportOutput').focus();
					$('#exportOutput').select();
					showToast('浏览器未开放剪贴板权限，已选中文本');
				}
			}

			function currentColors() {
				return currentPalette().map((color) => simulatedHex(color.hex));
			}

			function closestPair(colors = currentColors()) {
				let closest = { distance: Infinity, a: 0, b: 1 };
				for (let a = 0; a < colors.length; a += 1) {
					for (let b = a + 1; b < colors.length; b += 1) {
						const distance = deltaE(colors[a], colors[b]);
						if (distance < closest.distance) closest = { distance, a, b };
					}
				}
				return closest;
			}

			function renderPalette() {
				paletteList.innerHTML = currentPalette().map((color, index) => `
					<button class="swatch-card${index === state.selected ? ' is-selected' : ''}" type="button" role="option" aria-selected="${index === state.selected}" data-select="${index}" title="${escapeHtml(color.name)} · ${color.hex}">
						<span class="swatch-color" style="background:${simulatedHex(color.hex)}"></span>
						<span class="swatch-meta"><b>${String(index + 1).padStart(2, '0')} · ${escapeHtml(color.name)}</b><span>${color.hex}</span></span>
					</button>
				`).join('');
			}

			function renderEditor() {
				const color = currentPalette()[state.selected];
				const oklch = hexToOklch(color.hex);
				$('#selectedNumber').textContent = `#${String(state.selected + 1).padStart(2, '0')}`;
				$('#nativeColor').value = color.hex;
				$('#nameInput').value = color.name;
				$('#hexInput').value = color.hex;
				$('#lightnessRange').value = (oklch.L * 100).toFixed(1);
				$('#chromaRange').value = oklch.C.toFixed(3);
				$('#hueRange').value = oklch.H.toFixed(1);
				$('#lightnessOutput').value = `${(oklch.L * 100).toFixed(1)}%`;
				$('#chromaOutput').value = oklch.C.toFixed(3);
				$('#hueOutput').value = `${oklch.H.toFixed(1)}°`;
				$('#moveLeftButton').disabled = state.selected === 0;
				$('#moveRightButton').disabled = state.selected === 9;
				renderContrast(color.hex);
			}

			function renderContrast(hex) {
				const theme = previewTheme();
				const samples = [
					{ background: theme.surface, foreground: hex, label: `颜色 / ${state.surface === 'dark' ? '深色' : '浅色'}表面` },
					{ background: hex, foreground: '#FFFFFF', label: '白字 / 色底' },
					{ background: hex, foreground: '#18181C', label: '深字 / 色底' },
				];
				$('#contrastGrid').innerHTML = samples.map((sample) => {
					const ratio = contrastRatio(sample.background, sample.foreground);
					const grade = ratio >= 4.5 ? 'AA 正文' : ratio >= 3 ? '仅大字 / 图形' : '不通过';
					return `<div class="contrast-sample" style="background:${sample.background};color:${sample.foreground}"><span>${sample.label}</span><b>${ratio.toFixed(2)} : 1</b><span>${grade}</span></div>`;
				}).join('');
			}

			function previewTheme() {
				return state.surface === 'dark'
					? { bg: '#101014', surface: '#18181C', border: '#3D3D43', text: '#F5F5F7', muted: '#A5A5AD' }
					: { bg: '#F5F5F7', surface: '#FFFFFF', border: '#E0E0E6', text: '#1F2225', muted: '#646A70' };
			}

			function renderQuality() {
				const palette = currentPalette();
				const theme = previewTheme();
				const normalClosest = closestPair(palette.map((color) => color.hex));
				const simulatedClosest = closestPair();
				const classify = (distance) => distance >= 12 ? 'is-good' : distance >= 8 ? 'is-watch' : 'is-risk';
				const contrastPasses = palette.filter((color) => contrastRatio(color.hex, theme.surface) >= 3).length;
				$('#qualityStrip').innerHTML = `
					<div class="quality-item ${classify(normalClosest.distance)}"><span>标准视觉最接近</span><b>${normalClosest.distance.toFixed(1)} ΔE · ${normalClosest.a + 1}/${normalClosest.b + 1}</b></div>
					<div class="quality-item ${classify(simulatedClosest.distance)}"><span>当前模拟最接近</span><b>${simulatedClosest.distance.toFixed(1)} ΔE · ${simulatedClosest.a + 1}/${simulatedClosest.b + 1}</b></div>
					<div class="quality-item ${contrastPasses === 10 ? 'is-good' : 'is-watch'}"><span>图形对比 ≥ 3:1</span><b>${contrastPasses} / 10 色</b></div>
				`;
			}

			function renderPreview() {
				const colors = currentColors();
				const palette = currentPalette();
				const theme = previewTheme();
				previewCanvas.style.setProperty('--preview-bg', theme.bg);
				previewCanvas.style.setProperty('--preview-surface', theme.surface);
				previewCanvas.style.setProperty('--preview-border', theme.border);
				previewCanvas.style.setProperty('--preview-text', theme.text);
				previewCanvas.style.setProperty('--preview-muted', theme.muted);

				const linePaths = colors.map((color, index) => {
					const points = Array.from({ length: 8 }, (_, step) => {
						const x = 25 + step * 57;
						const wave = Math.sin((step + index * .72) * .95) * 22;
						const y = 110 + wave + (index - 4.5) * 9 + ((step * (index % 3 - 1)) * 1.6);
						return `${x},${Math.max(18, Math.min(210, y)).toFixed(1)}`;
					});
					return `<polyline class="chart-line" stroke="${color}" points="${points.join(' ')}" />`;
				}).join('');

				const dots = colors.map((color, index) => {
					const x = 25 + 7 * 57;
					const wave = Math.sin((7 + index * .72) * .95) * 22;
					const y = Math.max(18, Math.min(210, 110 + wave + (index - 4.5) * 9 + (7 * (index % 3 - 1)) * 1.6));
					return `<circle class="chart-dot" cx="${x}" cy="${y.toFixed(1)}" r="3.5" fill="${color}" />`;
				}).join('');

				const grid = [35, 80, 125, 170, 215].map((y) => `<line class="chart-grid" x1="25" y1="${y}" x2="424" y2="${y}" />`).join('');
				const labels = palette.map((color, index) => `<span class="legend-item"><i style="background:${colors[index]}"></i><span>${String(index + 1).padStart(2, '0')} ${escapeHtml(color.name)}</span></span>`).join('');
				const bars = colors.map((color, index) => `<i class="bar" data-index="${index + 1}" style="height:${48 + ((index * 37) % 118)}px;background:${color}"></i>`).join('');
				const stack = colors.map((color, index) => `<i style="flex:${5 + ((index * 7) % 13)};background:${color}"></i>`).join('');
				const matrix = Array.from({ length: 60 }, (_, index) => `<i style="background:${colors[(index * 7 + Math.floor(index / 10) * 3) % 10]};opacity:${.46 + (index % 4) * .17}"></i>`).join('');

				previewCanvas.innerHTML = `
					<div class="preview-main">
						<div class="preview-module">
							<h3>多人物评分趋势</h3>
							<p>10 条系列同时出现时，检查线条交叉后的辨识度。</p>
							<div class="chart-wrap">
								<svg viewBox="0 0 450 240" role="img" aria-label="十色折线图预览">${grid}${linePaths}${dots}<text class="chart-label" x="25" y="235">作品序列</text></svg>
							</div>
						</div>
						<div class="preview-module">
							<h3>评分分布分组</h3>
							<p>每种颜色只出现一次时，检查相邻柱的视觉重量。</p>
							<div class="bar-chart" aria-label="十色分组柱状图预览">${bars}</div>
						</div>
					</div>
					<div class="preview-side">
						<div class="preview-module"><h3>图例</h3><p>名称和顺序会同步到导出结果。</p><div class="legend">${labels}</div></div>
						<div class="preview-module"><h3>堆叠比例</h3><p>小面积片段是否仍能区分。</p><div class="stack">${stack}</div></div>
						<div class="preview-module"><h3>密集矩阵</h3><p>重复与低透明度场景。</p><div class="matrix">${matrix}</div></div>
					</div>
				`;
			}

			function exportText() {
				const light = state.palettes.light;
				const dark = state.palettes.dark;
				if (state.format === 'json') {
					return JSON.stringify({ name: 'Bangumi Staff Statistics categorical palettes', palettes: state.palettes }, null, 2);
				}
				return [
					':root {',
					...light.map((color, index) => `  --series-${String(index + 1).padStart(2, '0')}: ${color.hex}; /* ${color.name} */`),
					'}',
					'',
					':root[data-theme="dark"] {',
					...dark.map((color, index) => `  --series-${String(index + 1).padStart(2, '0')}: ${color.hex}; /* ${color.name} */`),
					'}',
					'',
					'const seriesColorPalettes = {',
					`  light: [${light.map((color) => `'${color.hex}'`).join(', ')}],`,
					`  dark: [${dark.map((color) => `'${color.hex}'`).join(', ')}],`,
					'} as const',
				].join('\n');
			}

			function renderExport() {
				$('#exportOutput').value = exportText();
				$('#formatButton').textContent = state.format === 'css' ? '切换 JSON' : '切换 CSS';
			}

			function render() {
				renderPalette();
				renderEditor();
				renderQuality();
				renderPreview();
				renderExport();
				$('#undoButton').disabled = state.history.length === 0;
				$('#redoButton').disabled = state.future.length === 0;
			}

			function startOklchEdit() {
				if (rangeEditStart === null) rangeEditStart = snapshot();
			}

			function previewOklch() {
				const L = Number($('#lightnessRange').value) / 100;
				const C = Number($('#chromaRange').value);
				const H = Number($('#hueRange').value);
				const hex = oklchToHex({ L, C, H });

				currentPalette()[state.selected].hex = hex;
				localStorage.setItem(STORAGE_KEY, snapshot());
				$('#nativeColor').value = hex;
				$('#hexInput').value = hex;
				$('#lightnessOutput').value = `${(L * 100).toFixed(1)}%`;
				$('#chromaOutput').value = C.toFixed(3);
				$('#hueOutput').value = `${H.toFixed(1)}°`;
				renderPalette();
				renderContrast(hex);
				renderQuality();
				renderPreview();
				renderExport();
			}

			function finishOklchEdit() {
				if (rangeEditStart === null) return;
				const previous = rangeEditStart;
				rangeEditStart = null;
				commit(previous);
			}

			function moveSelected(direction) {
				const target = state.selected + direction;
				if (target < 0 || target > 9) return;
				mutate(() => {
					for (const theme of ['light', 'dark']) {
						[state.palettes[theme][state.selected], state.palettes[theme][target]] = [state.palettes[theme][target], state.palettes[theme][state.selected]];
					}
					state.selected = target;
				});
			}

			function parseImport(value) {
				const parsed = JSON.parse(value);
				const palettes = parsed?.palettes ?? parsed;
				const fallback = {
					light: createPalette(INITIAL_PALETTES.light),
					dark: createPalette(INITIAL_PALETTES.dark),
				};
				const light = normalizePalette(palettes?.light, fallback.light);
				const dark = normalizePalette(palettes?.dark, fallback.dark);
				if (light && dark) return { palettes: { light, dark } };

				const source = Array.isArray(parsed) ? parsed : parsed?.colors;
				const palette = normalizePalette(source, currentPalette());
				if (!palette) throw new Error('需要当前主题的 10 个颜色，或 Light / Dark 各 10 个颜色');
				return { palette };
			}

			function escapeHtml(value) {
				return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
			}

			paletteList.addEventListener('click', (event) => {
				const target = event.target.closest('[data-select]');
				if (!target) return;
				state.selected = Number(target.dataset.select);
				render();
			});

			$('#nativeColor').addEventListener('input', (event) => mutate(() => { currentPalette()[state.selected].hex = normalizeHex(event.target.value); }));
			$('#nameInput').addEventListener('change', (event) => mutate(() => {
				const name = event.target.value.trim() || `颜色 ${state.selected + 1}`;
				state.palettes.light[state.selected].name = name;
				state.palettes.dark[state.selected].name = name;
			}));
			$('#hexInput').addEventListener('input', (event) => {
				const hex = normalizeHex(event.target.value);
				if (hex && hex !== currentPalette()[state.selected].hex) mutate(() => { currentPalette()[state.selected].hex = hex; });
			});
			$('#hexInput').addEventListener('change', (event) => {
				const hex = normalizeHex(event.target.value);
				if (!hex) { showToast('请输入 6 位 HEX，例如 #288183'); renderEditor(); return; }
				mutate(() => { currentPalette()[state.selected].hex = hex; });
			});

			['#lightnessRange', '#chromaRange', '#hueRange'].forEach((selector) => {
				const range = $(selector);
				range.addEventListener('pointerdown', startOklchEdit);
				range.addEventListener('keydown', startOklchEdit);
				range.addEventListener('input', previewOklch);
				range.addEventListener('change', finishOklchEdit);
				range.addEventListener('pointerup', finishOklchEdit);
				range.addEventListener('pointercancel', finishOklchEdit);
				range.addEventListener('blur', finishOklchEdit);
			});
			$('#moveLeftButton').addEventListener('click', () => moveSelected(-1));
			$('#moveRightButton').addEventListener('click', () => moveSelected(1));
			$('#undoButton').addEventListener('click', undo);
			$('#redoButton').addEventListener('click', redo);
			$('#copyColorButton').addEventListener('click', () => copyText(currentPalette()[state.selected].hex, '当前 HEX 已复制'));
			$('#copyAllButton').addEventListener('click', () => copyText(exportText(), '完整调色盘已复制'));
			$('#copyOutputButton').addEventListener('click', () => copyText(exportText(), '导出内容已复制'));

			$('#visionSelect').addEventListener('change', (event) => { state.vision = event.target.value; renderPalette(); renderQuality(); renderPreview(); });
			$('#surfaceSelect').addEventListener('change', (event) => {
				state.surface = event.target.value;
				document.documentElement.dataset.theme = state.surface;
				document.querySelector('meta[name="theme-color"]').content = state.surface === 'dark' ? '#101014' : '#f5f5f7';
				render();
			});

			$('#formatButton').addEventListener('click', () => { state.format = state.format === 'css' ? 'json' : 'css'; renderExport(); });
			$('#downloadButton').addEventListener('click', () => {
				const extension = state.format === 'css' ? 'css' : 'json';
				const blob = new Blob([exportText()], { type: state.format === 'css' ? 'text/css' : 'application/json' });
				const link = document.createElement('a');
				link.href = URL.createObjectURL(blob);
				link.download = `bgmss-categorical-palette.${extension}`;
				link.click();
				URL.revokeObjectURL(link.href);
				showToast(`已生成 ${extension.toUpperCase()} 文件`);
			});

			$('#resetButton').addEventListener('click', () => {
				if (!confirm('恢复最初的 Light / Dark 双主题候选？当前修改仍可通过“撤销”找回。')) return;
				mutate(() => {
					state.palettes = {
						light: createPalette(INITIAL_PALETTES.light),
						dark: createPalette(INITIAL_PALETTES.dark),
					};
					state.selected = 0;
				});
				showToast('已恢复初始候选');
			});

			$('#importButton').addEventListener('click', () => {
				$('#importInput').value = JSON.stringify({ palettes: state.palettes }, null, 2);
				$('#importDialog').showModal();
			});
			$('#cancelImportButton').addEventListener('click', () => $('#importDialog').close());
			$('#importForm').addEventListener('submit', (event) => {
				event.preventDefault();
				try {
					const imported = parseImport($('#importInput').value);
					mutate(() => {
						if (imported.palettes) state.palettes = imported.palettes;
						else state.palettes[state.surface] = imported.palette;
						state.selected = 0;
					});
					$('#importDialog').close();
					showToast('调色盘已导入');
				} catch (error) {
					showToast(error.message || '无法导入');
				}
			});

			document.addEventListener('keydown', (event) => {
				if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
					event.preventDefault();
					event.shiftKey ? redo() : undo();
				}
			});

			render();
		})();
	</script>
</body>
</html>
