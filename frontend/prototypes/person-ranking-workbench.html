<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangumi Staff Statistics · 人物排行</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #f52272;
      --pink-strong: #d91962;
      --pink-solid: #c71855;
      --on-pink: #ffffff;
      --pink-soft: #fff0f5;
      --pink-wash: #fff8fb;
      --ink: #17191f;
      --muted: #5f6875;
      --muted-2: #68717f;
      --page: #edf0f4;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #eef1f5;
      --line: #dde1e8;
      --line-strong: #c9ced8;
      --success: #0e6b4d;
      --danger: #ba3057;
      --focus: #0f6cbd;
      --radius-sm: 7px;
      --radius: 11px;
      --radius-lg: 16px;
      --shadow: 0 2px 8px rgba(25, 30, 40, 0.08);
      --header: #181b22;
      --header-ink: #f9fafc;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --font: "Noto Sans CJK SC", "Noto Sans SC", "Noto Sans JP", "Microsoft YaHei", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --pink: #ff4b8d;
      --pink-strong: #ff70a6;
      --pink-solid: #ff70a6;
      --on-pink: #17191f;
      --pink-soft: #3a1f2b;
      --pink-wash: #271d22;
      --ink: #f2f4f8;
      --muted: #b0b6c1;
      --muted-2: #878e9a;
      --page: #111318;
      --surface: #1b1e25;
      --surface-2: #22262e;
      --surface-3: #292e37;
      --line: #343a45;
      --line-strong: #48505e;
      --success: #62c7a6;
      --danger: #ff7b9d;
      --focus: #70b7f4;
      --header: #0c0e12;
      --header-ink: #f9fafc;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    html { min-width: 0; background: var(--page); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--pink) 7%, var(--page)) 0, var(--page) 260px),
        var(--page);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .46; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    svg.icon { width: 1.05em; height: 1.05em; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .app-header {
      position: sticky;
      z-index: 30;
      top: 0;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 3vw, 42px);
      color: var(--header-ink);
      background: var(--header);
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .brand { display: flex; align-items: center; min-width: 0; gap: 11px; font-weight: 720; letter-spacing: -.02em; }
    .brand-mark {
      position: relative;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 9px 9px 9px 3px;
      color: white;
      background: var(--pink);
      font-size: 13px;
      font-weight: 900;
      box-shadow: inset 0 -4px 0 rgba(110, 0, 43, .18);
    }
    .brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
    .brand-title span { color: #ff6ba2; }
    .header-tools { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: transparent;
      transition: background 180ms var(--ease), transform 180ms var(--ease);
    }
    .icon-button:hover { background: rgba(255,255,255,.1); }
    .icon-button:active { transform: scale(.94); }

    .page { width: min(1560px, 100%); margin: 0 auto; padding: 22px clamp(12px, 2.4vw, 36px) 38px; }

    .query-surface {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .query-surface::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, var(--pink) 0 18%, color-mix(in srgb, var(--pink) 20%, transparent) 18% 100%);
    }
    .query-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .query-heading h1 { margin: 0; font-size: clamp(20px, 2vw, 26px); letter-spacing: -.035em; line-height: 1.2; }
    .query-heading p { max-width: 56ch; margin: 0; color: var(--muted); font-size: 13px; text-align: right; text-wrap: pretty; }

    .query-grid, .enabled-grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 13px; }
    .enabled-grid { grid-template-columns: repeat(3, minmax(190px, 1fr)); margin-top: 13px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .collection-field { min-width: 0; margin: 0; border: 0; padding: 0; }
    .collection-field legend { margin-bottom: 6px; padding: 0; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .collection-control {
      min-height: 44px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 3px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      background: var(--surface);
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
    }
    .collection-control:hover { border-color: color-mix(in srgb, var(--pink) 46%, var(--line-strong)); }
    .collection-control:focus-within { border-color: var(--pink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink) 14%, transparent); }
    .collection-control label { min-height: 32px; display: inline-flex; align-items: center; gap: 5px; margin: 0; color: var(--ink); font-size: 12px; font-weight: 560; letter-spacing: 0; cursor: pointer; }
    .collection-control input { width: 16px; height: 16px; margin: 0; accent-color: var(--pink); }
    .collection-field:disabled .collection-control { color: var(--muted-2); background: var(--surface-3); opacity: .66; }
    .field-control, .tag-control {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 0 12px;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
    }
    .field-control:hover, .tag-control:hover { border-color: color-mix(in srgb, var(--pink) 46%, var(--line-strong)); }
    .field-control:focus, .tag-control:focus { border-color: var(--pink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink) 18%, transparent); outline: 2px solid var(--focus); outline-offset: 2px; }
    .field-control:disabled { color: var(--muted-2); background: var(--surface-3); }
    .range-control { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 7px; }
    .range-control .field-control { min-width: 0; text-align: center; padding: 0 8px; }
    .range-separator { color: var(--muted-2); }
    .enabled-field {
      position: relative;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--pink-wash);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pink) 22%, var(--line));
    }
    .enabled-field .remove-condition {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
    }
    .enabled-field .remove-condition:hover { color: var(--pink); background: color-mix(in srgb, var(--pink) 10%, transparent); }
    .enabled-field label { padding-right: 28px; }

    .query-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 17px; }
    .action-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 0 17px;
      font-weight: 700;
      background: var(--surface);
      transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease);
    }
    .button:hover { border-color: var(--pink); }
    .button:active { transform: translateY(1px); }
    .button.primary { min-width: 112px; border-color: var(--pink-solid); color: var(--on-pink); background: var(--pink-solid); }
    .button.primary:hover { border-color: var(--pink-strong); background: var(--pink-strong); }
    .button .spinner { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.45); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
    .button.is-loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .query-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px 12px;
      min-height: 44px;
      margin: 14px 0 0;
      padding: 10px 4px;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 90%, var(--pink) 10%);
    }
    .summary-item { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 650; }
    .summary-item + .summary-item::before { content: "·"; margin-right: 7px; color: var(--pink); font-weight: 900; }
    .summary-item.secondary { color: var(--muted); font-weight: 520; }

    .result-shell { margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow); }
    .pagination-bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      background: var(--surface);
    }
    .pagination-bar.top { border-bottom: 1px solid var(--line); }
    .pagination-bar.bottom { border-top: 1px solid var(--line); }
    .pagination-meta { min-width: max-content; color: var(--muted); font-size: 13px; }
    .pagination-meta strong { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
    .pager-layout { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
    .pager-pages, .pager-size, .pager-jump { display: flex; align-items: center; gap: 6px; }
    .page-button {
      min-width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 9px;
      background: var(--surface);
      font-variant-numeric: tabular-nums;
    }
    .page-button:not(:disabled):hover { border-color: var(--pink); color: var(--pink-strong); }
    .page-button[aria-current="page"] { border-color: var(--pink-solid); color: var(--on-pink); background: var(--pink-solid); font-weight: 760; }
    .pager-select, .jump-input {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 0 9px;
    }
    .jump-input { width: 58px; text-align: center; }
    .pager-label { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .result-body { display: grid; grid-template-columns: minmax(350px, 36%) minmax(0, 1fr); height: min(720px, calc(100vh - 118px)); min-height: 620px; }
    .ranking-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface-2); }
    .ranking-head {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .ranking-title { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .ranking-sort { height: 36px; max-width: 126px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 8px; font-size: 13px; }
    .ranking-columns {
      display: grid;
      grid-template-columns: 34px minmax(120px, 1fr) 78px 48px 48px 28px;
      gap: 8px;
      padding: 8px 12px;
      color: var(--muted-2);
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .ranking-columns span:nth-child(2) { text-align: left; }
    .ranking-list { min-height: 0; flex: 1; overflow: auto; scrollbar-gutter: stable; }
    .person-block { border-top: 1px solid var(--line); }
    .person-block:first-child { border-top: 0; }
    .person-row {
      position: relative;
      width: 100%;
      min-height: 76px;
      display: grid;
      grid-template-columns: 34px minmax(120px, 1fr) 78px 48px 48px 28px;
      gap: 8px;
      align-items: center;
      border: 0;
      padding: 10px 12px;
      color: inherit;
      background: transparent;
      text-align: left;
      overflow: hidden;
      isolation: isolate;
      scroll-margin-top: 70px;
      transition: background 180ms var(--ease), transform 180ms var(--ease);
    }
    .person-row::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--count-progress, 0%);
      background: linear-gradient(90deg, color-mix(in srgb, var(--pink) 18%, transparent), color-mix(in srgb, var(--pink) 4%, transparent));
      opacity: .9;
    }
    .person-row:hover { background: color-mix(in srgb, var(--surface) 65%, var(--pink-soft)); }
    .person-row[aria-current="true"] { background: var(--pink-soft); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pink) 70%, transparent); }
    .rank-number { color: var(--muted); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
    .person-row[data-rank="1"] .rank-number, .person-row[data-rank="2"] .rank-number, .person-row[data-rank="3"] .rank-number { color: var(--pink-strong); }
    .person-names { min-width: 0; }
    .person-cn { display: block; font-size: 15px; font-weight: 780; line-height: 1.3; overflow-wrap: anywhere; }
    .person-ja { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .career-list { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .count-cell { min-width: 0; text-align: right; }
    .count-value, .metric-value { display: block; font-weight: 780; font-variant-numeric: tabular-nums; }
    .count-label { display: block; color: var(--muted-2); font-size: 10px; }
    .count-cell::after { content: ""; display: block; height: 3px; margin-top: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--pink) 0 var(--count-progress), var(--line) var(--count-progress) 100%); }
    .row-metric { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
    .row-metric.best { color: var(--pink-strong); font-weight: 760; }
    .row-chevron { display: grid; place-items: center; color: var(--muted); transition: transform 180ms var(--ease); }
    .person-row[aria-current="true"] .row-chevron { color: var(--pink); }
    .person-row[aria-expanded="true"] .row-chevron { transform: rotate(90deg); }

    .detail-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; background: var(--surface); }
    .detail-view { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; container-type: inline-size; }
    .person-hero {
      position: relative;
      flex: 0 0 auto;
      padding: 18px 20px 16px;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 94% 0, color-mix(in srgb, var(--pink) 12%, transparent), transparent 34%),
        var(--surface);
    }
    .person-profile-row { display: grid; grid-template-columns: 88px minmax(180px, .75fr) minmax(300px, 1.25fr); gap: 16px; align-items: start; }
    .person-portrait { width: 88px; aspect-ratio: 3 / 4; margin: 0; overflow: hidden; border-radius: 10px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line); }
    .person-portrait img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center top; }
    .person-portrait-fallback { height: 100%; display: grid; place-content: center; gap: 4px; padding: 8px; color: var(--muted); font-size: 10px; line-height: 1.25; text-align: center; }
    .person-portrait-fallback strong { color: var(--pink-strong); font-size: 24px; line-height: 1; }
    .person-identity { min-width: 0; padding-top: 2px; }
    .mobile-person-identity { align-self: center; }
    .person-title-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 10px; }
    .person-title-line h2 { margin: 0; font-size: 28px; line-height: 1.18; letter-spacing: -.035em; text-wrap: balance; }
    .person-title-ja { color: var(--muted); font-size: 16px; font-weight: 560; }
    .person-meta-line { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .person-meta-line span { display: inline-flex; align-items: center; gap: 6px; }
    .person-meta-line span + span::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: var(--pink); }
    .person-meta-line strong { color: var(--ink); font-weight: 760; font-variant-numeric: tabular-nums; }
    .mobile-person-identity .person-meta-line { margin-top: 0; }
    .score-ledger { min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(54px, 1fr)); align-self: stretch; margin: 0; border-block: 1px solid var(--line); }
    .score-ledger > div { min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 8px 9px; }
    .score-ledger > div + div { border-left: 1px solid var(--line); }
    .score-ledger dt { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .score-ledger dd { margin: 2px 0 0; font-size: 18px; font-weight: 790; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .score-ledger .score-extreme dd { color: var(--pink-strong); }

    .person-insights { display: grid; grid-template-columns: minmax(280px, 1.15fr) minmax(260px, .85fr); gap: 18px; margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--line); }
    .insight-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .insight-heading h3 { margin: 0; font-size: 13px; }
    .insight-heading span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .rating-bars { height: 76px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; align-items: end; }
    .rating-bin { min-width: 0; height: 100%; display: grid; grid-template-rows: 14px minmax(0, 1fr) 14px; align-items: end; text-align: center; }
    .rating-count { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; line-height: 1; }
    .rating-track { height: 44px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line-strong); }
    .rating-fill { width: 100%; height: var(--bar-height); min-height: 3px; border-radius: 4px 4px 0 0; background: var(--pink); transition: height 220ms var(--ease); }
    .rating-bin.is-empty .rating-fill { min-height: 0; opacity: 0; }
    .rating-label { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }

    .preference-list { display: grid; gap: 0; }
    .preference-slice { width: 100%; min-width: 0; min-height: 64px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 9px; align-items: center; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 7px 4px; color: inherit; background: transparent; text-align: left; cursor: pointer; transition: background 160ms var(--ease); }
    .preference-slice:first-child { border-top: 0; }
    .preference-slice:hover { background: color-mix(in srgb, var(--surface) 78%, var(--pink-soft)); }
    .preference-slice.is-empty { grid-template-columns: 1fr; cursor: default; }
    .preference-slice.is-empty:hover { background: transparent; }
    .preference-cover { width: 42px; height: 56px; overflow: hidden; border-radius: 6px; background: var(--surface-3); }
    .preference-cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .preference-cover .cover-fallback { font-size: 9px; }
    .preference-copy { min-width: 0; }
    .preference-label { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
    .preference-title { display: block; margin-top: 2px; font-size: 12px; font-weight: 760; line-height: 1.3; overflow-wrap: anywhere; text-wrap: pretty; }
    .preference-scores { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .preference-delta { justify-self: end; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .preference-slice.positive .preference-delta { color: var(--success); }
    .preference-slice.negative .preference-delta { color: var(--danger); }
    .rating-empty, .preference-empty { min-height: 56px; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; }

    .bio { max-width: 90ch; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
    .bio-copy { margin: 0; color: color-mix(in srgb, var(--ink) 82%, var(--muted)); font-size: 13px; text-wrap: pretty; }
    .bio-copy.is-collapsed { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

      const distribution = Array.from({ length: 10 }, () => 0);

        ratedWorks,
        distribution,
        highestRate: rates.length ? Math.max(...rates) : null,
        lowestRate: rates.length ? Math.min(...rates) : null,
        positive,

          <div class="works-toolbar">
            <label class="search-wrap"><span class="sr-only">搜索中日文作品名</span>${icon('search')}<input class="work-search" value="${escapeHTML(state.workSearch)}" placeholder="搜索中日文作品名"></label>
            <label><span class="sr-only">作品排序</span><select class="work-sort"><option value="score"${state.workSort === 'score' ? ' selected' : ''}>评分高优先</option><option value="favorite"${state.workSort === 'favorite' ? ' selected' : ''}>收藏多优先</option><option value="rank"${state.workSort === 'rank' ? ' selected' : ''}>Rank 靠前</option><option value="userRate"${state.workSort === 'userRate' ? ' selected' : ''}>我的评分高优先</option><option value="date"${state.workSort === 'date' ? ' selected' : ''}>日期新优先</option></select></label>
            <label><span class="sr-only">作品每页数量</span><select class="work-size"><option value="4"${state.workPageSize === 4 ? ' selected' : ''}>每页 4 部</option><option value="6"${state.workPageSize === 6 ? ' selected' : ''}>每页 6 部</option><option value="12"${state.workPageSize === 12 ? ' selected' : ''}>每页 12 部</option></select></label>
          </div>
          <div class="works-status" aria-live="polite"><span><strong data-work-count>0</strong> 部</span><span data-work-page-label></span></div>
          <div class="works-scroll"><div class="work-grid"></div></div>
          <div class="work-pager" role="navigation" aria-label="作品分页"></div>
        </section>
      </div>`;
    }

    function renderDesktopDetail() {
      els.desktopDetail.innerHTML = mobileView.matches ? '' : detailMarkup(selectedPerson(), 'desktop');
    }

    function filteredWorks(person) {
      const needle = state.workSearch.trim().toLocaleLowerCase();
      const list = person.works.filter((work) => !needle || work.titleCN.toLocaleLowerCase().includes(needle) || work.titleJA.toLocaleLowerCase().includes(needle));
      return list.sort((a, b) => {
        if (state.workSort === 'rank') return (a.rank || Number.MAX_SAFE_INTEGER) - (b.rank || Number.MAX_SAFE_INTEGER);
        if (state.workSort === 'date') return String(b.date).localeCompare(String(a.date));
        return (b[state.workSort] ?? -Infinity) - (a[state.workSort] ?? -Infinity) || a.rank - b.rank;
      });
    }

    function characterText(work) {
      const characters = work.characters || [];
      const visible = characters.slice(0, 2).map(([cn, ja, role]) => `${cn}${cn !== ja ? ` / ${ja}` : ''}（${role}）`);
      return `${work.position} · ${visible.join('、')}${characters.length > 2 ? `等 ${characters.length} 个角色` : ''}`;
    }

    function workCardMarkup(work) {
      const namesDiffer = work.titleCN !== work.titleJA;
      return `<article class="work-card">
        <div class="cover-wrap"><img src="${escapeHTML(work.image)}" alt="${escapeHTML(work.titleCN)}封面" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="cover-fallback" hidden>暂无封面</div></div>
        <div class="work-body">
          <span class="collection-mark">${escapeHTML(work.collection)} · ${Number(work.userRate) > 0 ? `${scoreText(Number(work.userRate))} 分` : '未评分'}</span>
          <h3 class="work-title">${escapeHTML(work.titleCN)}</h3>
          ${namesDiffer ? `<p class="work-title-ja">${escapeHTML(work.titleJA)}</p>` : ''}
          <p class="work-role"><strong>${escapeHTML(work.position)}</strong> · ${escapeHTML(characterText(work).replace(`${work.position} · `, ''))}</p>
          <div class="work-metrics">
            <div class="work-metric"><span>收藏人数</span><strong>${formatNumber(work.favorite)}</strong></div>
            <div class="work-metric score"><span>站内评分</span><strong>${work.score ? work.score.toFixed(1) : '—'}</strong></div>
            <div class="work-metric"><span>Bangumi Rank</span><strong>${work.rank ? `#${formatNumber(work.rank)}` : '未排名'}</strong></div>
          </div>
        </div>
      </article>`;
    }

    function compactPageItems(currentPage, pageCount) {
      const pageCandidates = pageCount <= 7
        ? Array.from({ length: pageCount }, (_, index) => index + 1)
        : [1, 2, currentPage - 1, currentPage, currentPage + 1, pageCount - 1, pageCount]
          .filter((page) => page >= 1 && page <= pageCount);
      const pages = [...new Set(pageCandidates)].sort((a, b) => a - b);
      return pages.flatMap((page, index) => {
        const previous = pages[index - 1];
        const ellipsis = previous && page - previous > 1 ? ['ellipsis'] : [];
        return [...ellipsis, page];
      });
    }

    function workPagerMarkup(pageCount) {
      const pageItems = compactPageItems(state.workPage, pageCount);
      return `<button class="page-button work-page-button" data-work-page="1" type="button" aria-label="作品第一页" ${state.workPage === 1 ? 'disabled' : ''}>${icon('first')}</button>
        <button class="page-button work-page-button" data-work-page="${Math.max(1, state.workPage - 1)}" type="button" aria-label="作品上一页" ${state.workPage === 1 ? 'disabled' : ''}>${icon('left')}</button>
        ${pageItems.map((item) => item === 'ellipsis' ? '<span class="pager-ellipsis" aria-hidden="true">…</span>' : `<button class="page-button work-page-button" data-work-page="${item}" type="button" ${item === state.workPage ? 'aria-current="page"' : ''}>${item}</button>`).join('')}
        <button class="page-button work-page-button" data-work-page="${Math.min(pageCount, state.workPage + 1)}" type="button" aria-label="作品下一页" ${state.workPage === pageCount ? 'disabled' : ''}>${icon('right')}</button>
        <button class="page-button work-page-button" data-work-page="${pageCount}" type="button" aria-label="作品最后一页" ${state.workPage === pageCount ? 'disabled' : ''}>${icon('last')}</button>`;
    }

    function renderWorks() {
      const person = selectedPerson();
      const works = filteredWorks(person);
      const pageCount = Math.max(1, Math.ceil(works.length / state.workPageSize));
      state.workPage = Math.min(state.workPage, pageCount);
      const start = (state.workPage - 1) * state.workPageSize;
      const pageWorks = works.slice(start, start + state.workPageSize);
      document.querySelectorAll(`.detail-view[data-person-id="${person.id}"]`).forEach((view) => {
        view.querySelector('[data-work-count]').textContent = works.length;
        view.querySelector('[data-work-page-label]').textContent = works.length ? `${state.workPage} / ${pageCount} 页` : '';
        const grid = view.querySelector('.work-grid');
        const scroll = view.querySelector('.works-scroll');
        const pager = view.querySelector('.work-pager');
        if (!pageWorks.length) {
          grid.innerHTML = `<div class="empty-works"><div><strong>没有匹配的作品</strong><button class="button clear-work-search" type="button">清除搜索</button></div></div>`;
          pager.hidden = true;
        } else {
          grid.innerHTML = pageWorks.map(workCardMarkup).join('');
          pager.innerHTML = workPagerMarkup(pageCount);
          pager.hidden = false;
        }
        scroll.scrollTop = 0;
      });
    }

    function personPageCount() { return Math.max(1, Math.ceil(people.length / state.personPageSize)); }

    function personPagerMarkup(position) {
      const pageCount = personPageCount();
      state.personPage = Math.min(state.personPage, pageCount);
      const pageButtons = compactPageItems(state.personPage, pageCount).map((item) => item === 'ellipsis' ? '<span class="pager-ellipsis" aria-hidden="true">…</span>' : `<button class="page-button" data-person-page="${item}" type="button" ${item === state.personPage ? 'aria-current="page"' : ''}>${item}</button>`).join('');
      const pages = `<div class="pager-pages"><button class="page-button" data-person-page="1" type="button" aria-label="人物第一页" ${state.personPage === 1 ? 'disabled' : ''}>${icon('first')}</button><button class="page-button" data-person-page="${Math.max(1, state.personPage - 1)}" type="button" aria-label="人物上一页" ${state.personPage === 1 ? 'disabled' : ''}>${icon('left')}</button>${pageButtons}<button class="page-button" data-person-page="${Math.min(pageCount, state.personPage + 1)}" type="button" aria-label="人物下一页" ${state.personPage === pageCount ? 'disabled' : ''}>${icon('right')}</button><button class="page-button" data-person-page="${pageCount}" type="button" aria-label="人物最后一页" ${state.personPage === pageCount ? 'disabled' : ''}>${icon('last')}</button></div>`;
      const size = `<label class="pager-size"><span class="pager-label">每页</span><select class="pager-select person-page-size" aria-label="人物每页数量"><option value="5"${state.personPageSize === 5 ? ' selected' : ''}>5 人</option><option value="10"${state.personPageSize === 10 ? ' selected' : ''}>10 人</option><option value="20"${state.personPageSize === 20 ? ' selected' : ''}>20 人</option><option value="50"${state.personPageSize === 50 ? ' selected' : ''}>50 人</option></select></label>`;
      const jump = `<label class="pager-jump"><span class="pager-label">跳至</span><input class="jump-input person-jump" inputmode="numeric" aria-label="跳转到人物页"><span class="pager-label">页</span></label>`;
      return `<div class="pagination-meta"><strong>${people.length}</strong> 人<span>第 ${state.personPage} / ${pageCount} 页</span></div><div class="pager-layout">${position === 'top' ? `${pages}${size}${jump}` : `${jump}${pages}${size}`}</div>`;
    }

    function renderPersonPagers() {
      els.topPager.innerHTML = personPagerMarkup('top');
      els.bottomPager.innerHTML = personPagerMarkup('bottom');
    }

    function goToPersonPage(page, focusPager) {
      state.personPage = Math.min(personPageCount(), Math.max(1, Number(page) || 1));
      state.selectedId = visiblePeople()[0]?.id || state.selectedId;
      state.mobileOpenId = state.selectedId;
      state.workSearch = '';
      state.workPage = 1;
      state.bioExpanded = false;
      renderPeople();
      requestAnimationFrame(() => focusPager?.querySelector('[aria-current="page"]')?.focus({ preventScroll: true }));
      announce(`已切换到人物第 ${state.personPage} 页`);
    }

    function restorePersonRowFocus(id, previousTop) {
      requestAnimationFrame(() => {
        const row = els.rankingList.querySelector(`.person-row[data-person-id="${id}"]`);
        if (!row) return;
        row.focus({ preventScroll: true });
        if (mobileView.matches && Number.isFinite(previousTop)) {
          const delta = row.getBoundingClientRect().top - previousTop;
          if (Math.abs(delta) > 1) window.scrollTo({ top: window.scrollY + delta, behavior: 'auto' });
        }
      });
    }

    function selectPerson(id) {
      const previousTop = mobileView.matches ? els.rankingList.querySelector(`.person-row[data-person-id="${id}"]`)?.getBoundingClientRect().top : null;
      if (mobileView.matches && state.selectedId === id) {
        state.mobileOpenId = state.mobileOpenId === id ? null : id;
        renderPeople();
        restorePersonRowFocus(id, previousTop);
        announce(state.mobileOpenId === id ? `已展开 ${selectedPerson().nameCN}` : `已收起 ${selectedPerson().nameCN}`);
        return;
      }
      const changedPerson = state.selectedId !== id;
      state.selectedId = id;
      state.mobileOpenId = id;
      if (changedPerson) state.workSearch = '';
      state.workPage = 1;
      state.bioExpanded = false;
      renderPeople();
      restorePersonRowFocus(id, previousTop);
      announce(`已选择 ${selectedPerson().nameCN}`);
    }

    els.optionGrid.addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-option-toggle]');
      if (toggle) toggleOption(toggle.dataset.optionToggle);
    });

    els.enabledFields.addEventListener('click', (event) => {
      const remove = event.target.closest('[data-remove-option]');
      if (remove) toggleOption(remove.dataset.removeOption, false);
    });

    els.enabledFields.addEventListener('input', (event) => {
      const input = event.target.closest('[data-extra-key]');
      if (!input) return;
      const config = state.draft[input.dataset.extraKey];
      if (input.dataset.tags) config.value = input.value.split(',').map((tag) => tag.trim()).filter(Boolean);
      else config.value[Number(input.dataset.index)] = input.value;
    });

    els.openOptions.addEventListener('click', () => { renderOptions(); els.optionsDialog.showModal(); });
    els.closeOptions.addEventListener('click', () => els.optionsDialog.close());
    els.optionsDialog.addEventListener('close', () => els.openOptions.focus());
    els.optionsDialog.addEventListener('click', (event) => {
      const rect = els.optionsDialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) els.optionsDialog.close();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && els.optionsDialog.open) {
        event.preventDefault();
        els.optionsDialog.close();
      }
    });

    els.queryForm.addEventListener('submit', (event) => {
      event.preventDefault();
      els.queryButton.classList.add('is-loading');
      els.queryButton.disabled = true;
      els.queryButton.querySelector('.query-button-label').textContent = '查询中';
      setTimeout(() => {
        state.applied = collectQuerySnapshot();
        state.personPage = 1;
        state.selectedId = sortedPeople()[0].id;
        state.mobileOpenId = state.selectedId;
        state.workSearch = '';
        state.workPage = 1;
        renderSummary();
        renderPeople();
        els.queryButton.classList.remove('is-loading');
        els.queryButton.disabled = false;
        els.queryButton.querySelector('.query-button-label').textContent = '查询';
        announce('查询条件已应用');
      }, 420);
    });

    els.subjectType.addEventListener('change', () => renderPositionOptions(els.subjectType.value));

    els.personSort.addEventListener('change', () => {
      state.personSort = els.personSort.value;
      state.personPage = 1;
      state.selectedId = sortedPeople()[0].id;
      state.mobileOpenId = state.selectedId;
      state.workSearch = '';
      state.workPage = 1;
      renderPeople();
    });

    els.rankingList.addEventListener('click', (event) => {
      const row = event.target.closest('.person-row[data-person-id]');
      if (row) selectPerson(Number(row.dataset.personId));
    });

    [els.topPager, els.bottomPager].forEach((pager) => {
      pager.addEventListener('click', (event) => {
        const button = event.target.closest('[data-person-page]');
        if (button && !button.disabled) goToPersonPage(button.dataset.personPage, pager);
      });
      pager.addEventListener('change', (event) => {
        if (!event.target.matches('.person-page-size')) return;
        state.personPageSize = Number(event.target.value);
        state.personPage = 1;
        state.selectedId = sortedPeople()[0].id;
        state.mobileOpenId = state.selectedId;
        state.workSearch = '';
        state.workPage = 1;
        renderPeople();
        requestAnimationFrame(() => pager.querySelector('.person-page-size')?.focus({ preventScroll: true }));
      });
      pager.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.target.matches('.person-jump')) goToPersonPage(event.target.value, pager);
      });
    });

    document.addEventListener('input', (event) => {
      if (!event.target.matches('.work-search')) return;
      state.workSearch = event.target.value;
      state.workPage = 1;
      document.querySelectorAll('.work-search').forEach((input) => { if (input !== event.target) input.value = state.workSearch; });
      renderWorks();
    });

    document.addEventListener('change', (event) => {
      if (event.target.matches('.work-sort')) {
        state.workSort = event.target.value;
        state.workPage = 1;
        document.querySelectorAll('.work-sort').forEach((select) => { select.value = state.workSort; });
        renderWorks();
      }
      if (event.target.matches('.work-size')) {
        state.workPageSize = Number(event.target.value);
        state.workPage = 1;
        document.querySelectorAll('.work-size').forEach((select) => { select.value = String(state.workPageSize); });
        renderWorks();
      }
    });

    document.addEventListener('click', (event) => {
      const highlightedWork = event.target.closest('[data-highlight-work]');
      if (highlightedWork) {
        state.workSearch = highlightedWork.dataset.highlightWork;
        state.workPage = 1;
        document.querySelectorAll('.work-search').forEach((input) => { input.value = state.workSearch; });
        renderWorks();
        announce(`已在命中作品中筛选《${state.workSearch}》`);
        return;
      }
      const pageButton = event.target.closest('.work-page-button');
      if (pageButton && !pageButton.disabled) {
        const context = pageButton.closest('.detail-view')?.dataset.detailContext;
        state.workPage = Number(pageButton.dataset.workPage);
        renderWorks();
        requestAnimationFrame(() => document.querySelector(`.detail-view[data-detail-context="${context}"] .work-pager [aria-current="page"]`)?.focus({ preventScroll: true }));
        announce(`作品第 ${state.workPage} 页`);
      }
      if (event.target.closest('.clear-work-search')) {
        const context = event.target.closest('.detail-view')?.dataset.detailContext;
        state.workSearch = '';
        state.workPage = 1;
        document.querySelectorAll('.work-search').forEach((input) => { input.value = ''; });
        renderWorks();
        requestAnimationFrame(() => document.querySelector(`.detail-view[data-detail-context="${context}"] .work-search`)?.focus({ preventScroll: true }));
      }
      if (event.target.closest('[data-bio-toggle]')) {
        state.bioExpanded = !state.bioExpanded;
        document.querySelectorAll('.bio-copy').forEach((copy) => copy.classList.toggle('is-collapsed', !state.bioExpanded));
        document.querySelectorAll('[data-bio-toggle]').forEach((button) => {
          button.textContent = state.bioExpanded ? '收起简介' : '展开简介';
          button.setAttribute('aria-expanded', String(state.bioExpanded));
        });
      }
    });

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      els.themeToggle.innerHTML = theme === 'dark' ? `${icon('sun')}` : `${icon('moon')}`;
      const themeLabel = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
      els.themeToggle.setAttribute('aria-label', themeLabel);
      els.themeToggle.title = themeLabel;
      try { localStorage.setItem('bgmss-prototype-theme', theme); } catch {}
    }

    els.themeToggle.addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    mobileView.addEventListener('change', () => renderPeople());

    try {
      applyTheme(localStorage.getItem('bgmss-prototype-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    } catch { applyTheme('light'); }
    renderPositionOptions(els.subjectType.value, els.position.value);
    renderOptions();
    renderEnabledFields();
    state.applied = collectQuerySnapshot();
    renderSummary();
    renderPeople();
  </script>
</body>
</html>
