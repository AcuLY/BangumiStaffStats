name: development-artifacts

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test, build, assemble, and smoke locally
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the candidate without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install reviewed Go bootstrap
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.4
          check-latest: false
          cache: false

      - name: Install exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          check-latest: false

      - name: Install exact npm
        shell: bash
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund

      - name: Create a local-only BuildKit builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: v0.34.1
          driver-opts: image=docker.io/moby/buildkit:v0.27.1@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368

      - name: Prepare exact Go toolchain in isolated cache
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/bgmss-ci-go-mod
          GOTOOLCHAIN: go1.26.5+auto
        run: go version >/dev/null

      - name: Verify exact toolchains
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/bgmss-ci-go-mod
          GOTOOLCHAIN: go1.26.5+auto
        run: node contracts/artifacts/bin/ci-toolchain-identity.mjs

      - name: Run Backend source gates
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ./scripts/check.sh

      - name: Run Frontend source and production-artifact gates
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Run Contracts and CI policy gates
        shell: bash
        run: |
          set -euo pipefail
          node --test contracts/artifacts/test/*.test.mjs
          node contracts/artifacts/bin/artifacts.mjs verify-component \
            contracts/artifacts/fixtures/positive/backend backend
          node contracts/artifacts/bin/artifacts.mjs verify-component \
            contracts/artifacts/fixtures/positive/frontend frontend

      - name: Build twice, assemble, and smoke only local artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            backend/build/.tmp \
            frontend/build/.tmp

          backend/build/check.sh --target-arch amd64 \
            | tee backend/build/.tmp/ci-check.log
          backend_root="$(
            sed -n 's/^BACKEND_ARTIFACT_ROOT=//p' \
              backend/build/.tmp/ci-check.log | tail -n 1
          )"
          test -n "$backend_root"

          (
            cd frontend
            npm run artifact:check -- --target-arch amd64
          ) | tee frontend/build/.tmp/ci-check.log
          frontend_root="$(
            sed -n 's/^FRONTEND_ARTIFACT_ROOT=//p' \
              frontend/build/.tmp/ci-check.log | tail -n 1
          )"
          test -n "$frontend_root"

          node contracts/artifacts/bin/coordinator.mjs smoke \
            --backend "$backend_root" \
            --frontend "$frontend_root"

      - name: Audit generated residue and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          node contracts/artifacts/bin/residue.mjs
          git diff --check

  operations-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/operations-preview.yml
