<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>共同出演 · 设计方向</title>
  <style>
    :root { color-scheme: dark; --pink:#f9389e; --bg:#0d0d12; --surface:#17171e; --line:#2a2a34; --text:#f7f5f8; --muted:#9f9aa8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 0%,#23141e 0,#0d0d12 42%); color:var(--text); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(760px,calc(100% - 40px)); padding:64px 0; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:58px; color:#d5d0d8; font-size:14px; }
    .mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid #ef4b9f; border-radius:10px; color:var(--pink); font-weight:800; }
    h1 { margin:0; font-size:clamp(34px,6vw,60px); letter-spacing:-.045em; line-height:1.05; }
    .lead { max-width:580px; margin:22px 0 38px; color:var(--muted); font-size:17px; line-height:1.75; }
    nav { display:grid; gap:12px; }
    a { display:flex; align-items:center; gap:18px; padding:20px 22px; border:1px solid var(--line); border-radius:16px; color:inherit; text-decoration:none; background:rgba(23,23,30,.86); transition:.2s ease; }
    a:hover { transform:translateX(5px); border-color:#8d315f; background:#1d171e; }
    .letter { width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; border-radius:13px; background:#28222a; color:var(--pink); font-weight:800; }
    .copy { flex:1; }
    .copy strong { display:block; margin-bottom:5px; font-size:17px; }
    .copy span { color:var(--muted); font-size:13px; }
    .arrow { color:#6f6974; font-size:22px; }
    .note { margin-top:24px; color:#706b77; font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">B</span><span>Bangumi Staff Statistics · 临时设计空间</span></div>
    <h1>共同出演，三种阅读方式</h1>
    <p class="lead">三版使用同一组 mock 数据，但分别强调完整报告、高效筛选与人物关系叙事。每个方案都位于独立路由。</p>
    <nav>
      <a href="/files/concept-a-report.html"><span class="letter">A</span><span class="copy"><strong>分析报告</strong><span>查询 → 结论 → 证据，最均衡且适合默认入口</span></span><span class="arrow">→</span></a>
      <a href="/files/concept-b-workbench.html"><span class="letter">B</span><span class="copy"><strong>分析工作台</strong><span>左侧持续筛选，右侧高密度比较，面向重度用户</span></span><span class="arrow">→</span></a>
      <a href="/files/concept-c-profile.html"><span class="letter">C</span><span class="copy"><strong>关系档案</strong><span>人物与合作历程优先，更有情绪和分享感</span></span><span class="arrow">→</span></a>
    </nav>
    <p class="note">所有人物、分数、作品和统计关系均为界面展示用 mock 数据。</p>
  </main>
</body>
</html>
