  <title>共同出演 · B × C 修订设计</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0e;--panel:#151519;--line:#2b2930;--text:#f5f1f3;--muted:#999198;--pink:#f23893;--cyan:#78d1d5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 10%,rgba(242,56,147,.08),transparent 30%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(860px,calc(100% - 40px));margin:auto;padding:68px 0}.brand{display:flex;align-items:center;gap:12px;color:#d7d0d5;font-size:13px}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pink);font-weight:800}.hero{margin:82px 0 46px}.hero h1{max-width:660px;margin:0 0 18px;font-family:"Songti SC","Noto Serif SC",serif;font-size:clamp(38px,7vw,68px);font-weight:700;line-height:1.06;letter-spacing:-.055em}.hero p{max-width:650px;margin:0;color:var(--muted);font-size:16px;line-height:1.8}.routes{display:grid;gap:12px}a{display:flex;align-items:center;gap:18px;padding:22px 24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:inherit;text-decoration:none;transition:.2s ease}a:hover{transform:translateX(5px);border-color:#6c3b58}.n{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#252229;color:var(--pink);font-size:13px;font-weight:800}.copy{flex:1}.copy b{display:block;margin-bottom:5px;font-size:17px}.copy span{color:var(--muted);font-size:13px}.arrow{color:#69636a;font-size:20px}.note{margin-top:26px;color:#706970;font-size:12px}
  </style>
</head>
<body>

    <div class="brand"><span class="mark">番</span><span>Bangumi Staff Statistics · 共同出演临时设计</span></div>
    <section class="hero"><h1>工作台效率，关系档案质感</h1><p>修订版把大量人物选择、完整分析和无共同作品状态拆成三个独立路由。所有人物、作品与统计均为界面展示用 mock 数据。</p></section>
    <nav class="routes">
      <a href="/files/co-star-select-v2.html"><span class="n">01</span><span class="copy"><b>从排行榜选择人物</b><span>跨分页选择、搜索、排序与常驻选择托盘</span></span><span class="arrow">→</span></a>
      <a href="/files/co-star-analysis-v2.html"><span class="n">02</span><span class="copy"><b>共同出演分析</b><span>双人完整报告与多人组合的渐进展示</span></span><span class="arrow">→</span></a>
      <a href="/files/co-star-empty-v2.html"><span class="n">03</span><span class="copy"><b>无共同作品</b><span>不展示伪指标，直接降级为清晰空状态</span></span><span class="arrow">→</span></a>
    </nav>
