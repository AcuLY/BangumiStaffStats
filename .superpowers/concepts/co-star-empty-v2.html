<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>共同出演 · 无共同作品状态 MOCK</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0e11;
      --surface: #15161a;
      --surface-strong: #1a1b20;
      --line: #2d2e35;
      --line-soft: #24252a;
      --text: #f5f1f3;
      --muted: #9b969c;
      --quiet: #716d73;
      --pink: #f43a98;
      --pink-soft: #ff8bc5;
      --cyan: #77d5dc;
      --cyan-soft: #b1eef1;
      --serif: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
      --sans: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 8%, rgba(244, 58, 152, .07), transparent 28rem),
        radial-gradient(circle at 90% 92%, rgba(119, 213, 220, .055), transparent 32rem),
        linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 30px 30px, 30px 30px, auto;
      font: 13px/1.5 var(--sans);
      font-variant-numeric: tabular-nums;
    }

    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 0 24px;
      border-top: 3px solid var(--pink);
      border-bottom: 1px solid var(--line);
      background: rgba(17, 18, 21, .94);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 7px;
      background: var(--pink);
      box-shadow: 0 0 24px rgba(244, 58, 152, .24);
      font-family: var(--serif);
      font-size: 17px;
    }

    .brand small {
      margin-left: 8px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .02em;
    }

    .routes {
      display: flex;
      gap: 4px;
      margin-left: 24px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101115;
    }

    .routes a {
      padding: 7px 13px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: color .16s ease, background .16s ease;
    }

    .routes a:hover { color: var(--text); }
    .routes .active {
      color: #fff;
      background: var(--pink);
      box-shadow: 0 4px 16px rgba(244, 58, 152, .24);
      font-weight: 750;
    }

    .workspace {
      width: min(1280px, calc(100% - 48px));
      margin: 0 auto;
      padding: 22px 0 56px;
    }

    .query-summary {
      display: grid;
      grid-template-columns: minmax(130px, .7fr) repeat(3, minmax(120px, 1fr)) auto;
      align-items: center;
      gap: 0;
      min-height: 64px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(22, 23, 27, .94);
    }

    .summary-title,
    .summary-item,
    .mock-flag { padding: 13px 17px; }

    .summary-title,
    .summary-item { border-right: 1px solid var(--line-soft); }

    .summary-title {
      color: #c9c4c8;
      font-size: 12px;
      font-weight: 720;
    }

    .summary-item small {
      display: block;
      margin-bottom: 2px;
      color: var(--quiet);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .summary-item strong {
      color: #d9d5d8;
      font-size: 11px;
      font-weight: 560;
    }

    .mock-flag {
      margin-right: 5px;
      color: #ffd095;
      border: 1px solid #704d22;
      border-radius: 6px;
      background: #2b2117;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .selection-head {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(440px, 1.5fr);
      gap: 36px;
      align-items: end;
      padding: 35px 4px 26px;
      border-bottom: 1px solid var(--line);
    }

    .title-copy p {
      margin: 0 0 7px;
      color: var(--pink-soft);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .title-copy h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.05em;
    }

    .selected-tray {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
    }

    .person {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-strong);
    }

    .portrait {
      display: grid;
      width: 46px;
      height: 46px;
      overflow: hidden;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 50%;
      background: #25262c;
    }

    .portrait svg { width: 100%; height: 100%; }

    .person-copy { min-width: 0; }

    .person-copy strong,
    .person-copy small { display: block; }

    .person-copy strong {
      overflow: hidden;
      font-family: var(--serif);
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person-copy small {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .person-key {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 5px;
      background: var(--pink);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
    }

    .person.b { border-color: rgba(119, 213, 220, .25); }
    .person.b .person-key { background: var(--cyan); color: #102225; }
    .versus { color: #5f5b61; font-family: var(--serif); font-size: 18px; }

    .empty-state {
      display: grid;
      grid-template-columns: minmax(340px, .9fr) minmax(360px, 1.1fr);
      align-items: center;
      min-height: 520px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        linear-gradient(115deg, rgba(244, 58, 152, .035), transparent 43%),
        linear-gradient(155deg, var(--surface-strong), #121317);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .2);
    }

    .illustration {
      min-width: 0;
      padding: 54px 24px 54px 42px;
    }

    .illustration svg {
      display: block;
      width: 100%;
      max-height: 340px;
    }

    .empty-copy {
      max-width: 510px;
      padding: 64px 64px 64px 40px;
    }

    .empty-copy h2 {
      max-width: 480px;
      margin: 0 0 18px;
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -.055em;
    }

    .empty-copy p {
      max-width: 430px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #202126;
      color: #ddd8db;
      font-size: 12px;
      font-weight: 730;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .button:hover { transform: translateY(-1px); border-color: #55515a; }

    .button.primary {
      border-color: var(--pink);
      background: var(--pink);
      color: #fff;
      box-shadow: 0 8px 24px rgba(244, 58, 152, .2);
    }

    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .state-note {
      margin: 13px 2px 0;
      color: #5f5b61;
      font-size: 10px;
      text-align: right;
    }

    @media (max-width: 980px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 9px; padding: 10px 16px; }
      .routes { width: 100%; margin-left: 0; overflow-x: auto; }
      .routes a { flex: 1; text-align: center; }
      .workspace { width: min(100% - 28px, 800px); }
      .query-summary { grid-template-columns: 1fr 1fr; }
      .summary-title, .summary-item { border-bottom: 1px solid var(--line-soft); }
      .summary-item:nth-of-type(3) { border-right: 0; }
      .mock-flag { justify-self: start; margin: 10px 14px; }
      .selection-head { grid-template-columns: 1fr; align-items: start; gap: 22px; }
      .empty-state { grid-template-columns: 1fr; min-height: auto; }
      .illustration { padding: 42px 40px 10px; }
      .illustration svg { max-height: 260px; }
      .empty-copy { max-width: 620px; padding: 28px 46px 54px; }
    }

    @media (max-width: 600px) {
      .brand small { display: none; }
      .routes a { padding-inline: 10px; }
      .workspace { width: min(100% - 20px, 520px); padding-top: 12px; }
      .query-summary { grid-template-columns: 1fr; }
      .summary-title, .summary-item { border-right: 0; }
      .summary-item:nth-of-type(3) { border-bottom: 1px solid var(--line-soft); }
      .selection-head { padding-top: 28px; }
      .selected-tray { grid-template-columns: 1fr; }
      .versus { display: none; }
      .illustration { padding: 34px 14px 4px; }
      .empty-copy { padding: 22px 24px 40px; }
      .empty-copy h2 { font-size: clamp(34px, 12vw, 48px); }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/files/co-star-select-v2.html">
      <span class="brand-mark" aria-hidden="true">番</span>
      <span>Bangumi Staff Statistics <small>/ 共同出演</small></span>
    </a>
    <nav class="routes" aria-label="共同出演流程">
      <a href="/files/co-star-select-v2.html">选择人物</a>
      <a href="/files/co-star-analysis-v2.html">分析结果</a>
      <a class="active" aria-current="page" href="/files/co-star-empty-v2.html">无共同作品</a>
    </nav>
  </header>

  <main class="workspace">
    <section class="query-summary" aria-label="当前查询摘要">
      <div class="summary-title">当前查询</div>
      <div class="summary-item"><small>Data scope</small><strong>全站数据</strong></div>
      <div class="summary-item"><small>Entries</small><strong>动画 · 游戏</strong></div>
      <div class="summary-item"><small>Role</small><strong>声优</strong></div>
      <span class="mock-flag">MOCK · 静态状态预览</span>
    </section>

    <header class="selection-head">
      <div class="title-copy">
        <p>Co-star analysis</p>
        <h1>共同出演分析</h1>
      </div>
      <div class="selected-tray" aria-label="已选人物">
        <article class="person a">
          <span class="portrait" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" fill="#2b2028"/>
              <circle cx="24" cy="18" r="8" fill="#c96b99" opacity=".7"/>
              <path d="M9 48c1-12 6-18 15-18s14 6 15 18H9Z" fill="#7b3b5b"/>

            </svg>
          </span>
          <span class="person-copy"><strong>宫野真守</strong><small>Miyano Mamoru</small></span>
          <span class="person-key">A</span>
        </article>
        <span class="versus" aria-hidden="true">×</span>
        <article class="person b">
          <span class="portrait" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect width="48" height="48" fill="#1e292c"/>
              <circle cx="24" cy="18" r="8" fill="#8fbec2" opacity=".72"/>
              <path d="M9 48c1-12 6-18 15-18s14 6 15 18H9Z" fill="#426d72"/>
              <path d="M14 19C13 9 18 5 24 5c7 0 11 5 10 15-3-6-7-9-11-11-2 5-5 8-9 10Z" fill="#17191b"/>
            </svg>
          </span>
          <span class="person-copy"><strong>水树奈奈</strong><small>Mizuki Nana</small></span>
          <span class="person-key">B</span>
        </article>
      </div>
    </header>

    <section class="empty-state" aria-labelledby="empty-title">
      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 620 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="leftGlow" x1="76" y1="70" x2="268" y2="290" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F43A98" stop-opacity=".3"/>
              <stop offset="1" stop-color="#F43A98" stop-opacity=".03"/>
            </linearGradient>
            <linearGradient id="rightGlow" x1="544" y1="70" x2="352" y2="290" gradientUnits="userSpaceOnUse">
              <stop stop-color="#77D5DC" stop-opacity=".27"/>
              <stop offset="1" stop-color="#77D5DC" stop-opacity=".03"/>
            </linearGradient>
          </defs>
          <circle cx="158" cy="180" r="114" fill="url(#leftGlow)" stroke="#F43A98" stroke-opacity=".22"/>
          <circle cx="462" cy="180" r="114" fill="url(#rightGlow)" stroke="#77D5DC" stroke-opacity=".22"/>
          <circle cx="158" cy="180" r="72" fill="#17171C" stroke="#F43A98" stroke-opacity=".72" stroke-width="2"/>
          <circle cx="462" cy="180" r="72" fill="#17171C" stroke="#77D5DC" stroke-opacity=".72" stroke-width="2"/>
          <circle cx="158" cy="156" r="19" fill="#F43A98" fill-opacity=".28"/>
          <path d="M115 224c4-35 19-51 43-51s39 16 43 51" fill="#F43A98" fill-opacity=".18"/>
          <circle cx="462" cy="156" r="19" fill="#77D5DC" fill-opacity=".28"/>
          <path d="M419 224c4-35 19-51 43-51s39 16 43 51" fill="#77D5DC" fill-opacity=".18"/>
          <path d="M230 180c25-18 44-25 66-26" stroke="#F43A98" stroke-opacity=".54" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/>
          <path d="M390 180c-25-18-44-25-66-26" stroke="#77D5DC" stroke-opacity=".54" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8"/>
          <path d="M230 193c25 18 44 25 66 26" stroke="#F43A98" stroke-opacity=".26" stroke-linecap="round"/>
          <path d="M390 193c-25 18-44 25-66 26" stroke="#77D5DC" stroke-opacity=".26" stroke-linecap="round"/>
          <path d="M310 143l12 12-12 12-12-12 12-12Z" fill="#25262C" stroke="#5A575E"/>
          <circle cx="158" cy="180" r="91" stroke="#F43A98" stroke-opacity=".12" stroke-dasharray="3 10"/>
          <circle cx="462" cy="180" r="91" stroke="#77D5DC" stroke-opacity=".12" stroke-dasharray="3 10"/>
        </svg>
      </div>
      <div class="empty-copy">
        <h2 id="empty-title">没有共同出演的作品</h2>
        <p>在当前数据范围和筛选条件下，两位人物的参与作品没有形成交集。可以更换人物，或放宽条目类型与职位条件后重新查询。</p>
        <div class="actions">
          <a class="button primary" href="/files/co-star-select-v2.html">返回选择人物</a>
          <a class="button" href="/files/co-star-select-v2.html#query-options">调整查询条件</a>
        </div>
      </div>
    </section>
    <p class="state-note">仅用于界面评审的 MOCK 状态，不代表真实 Bangumi 查询结果。</p>
  </main>
</body>
</html>
