[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "bangumi-staff-stats-updater"
version = "0.1.0"
description = "One-shot updater foundation for Bangumi Staff Stats"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
bgmss-updater = "bangumi_staff_stats_updater.cli:run"

[dependency-groups]
dev = [
  "hatchling==1.31.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "uv==0.11.32",
]

[tool.uv]
required-version = "==0.11.32"

[tool.hatch.build.targets.wheel]
packages = ["src/bangumi_staff_stats_updater"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
cache_dir = ".cache/mypy"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = ".cache/ruff"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
]

[tool.ruff.format]
docstring-code-format = true
