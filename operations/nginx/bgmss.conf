pid logs/nginx.pid;
error_log @@BGMSS_NGINX_LOG_ROOT@@/bgmss-error.log warn;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format bgmss_path_only
    '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent request_id=$request_id';
  access_log @@BGMSS_NGINX_LOG_ROOT@@/bgmss-access.log bgmss_path_only;
  error_log @@BGMSS_NGINX_LOG_ROOT@@/bgmss-error.log warn;
  server_tokens off;

  server {
    # This loopback listener is intentionally inert until an operator integrates
    # the reviewed locations into the public TLS vhost.
    listen 127.0.0.1:18081;
    server_name _;
    root @@BGMSS_FRONTEND_ROOT@@;
    index index.html;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /v2 {
      return 308 /v2/;
    }

    location ^~ /v2/api/v1/ {
      proxy_pass http://127.0.0.1:@@BGMSS_API_PORT@@/api/v1/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
    }

    location ^~ /v2/ {
      rewrite ^/v2/(.*)$ /$1 break;
      root @@BGMSS_FRONTEND_ROOT@@;
      try_files $uri $uri/ @bgmss_v2_spa;
    }

    location @bgmss_v2_spa {
      root @@BGMSS_FRONTEND_ROOT@@;
      try_files /index.html =404;
    }

    location / {
      root @@BGMSS_LEGACY_FRONTEND_ROOT@@;
      try_files $uri $uri/ /index.html;
    }

    location = /metrics {
      return 404;
    }
  }
}
