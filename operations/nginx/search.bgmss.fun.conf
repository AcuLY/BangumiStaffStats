log_format bgmss_path
  '$remote_addr - $remote_user [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent" request_time=$request_time';

upstream bgmss_v2_api {
  server 127.0.0.1:18080;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name search.bgmss.fun;

  root /srv/bgmss-v2/current-frontend;
  index index.html;

  access_log /var/log/nginx/bgmss-v2-access.log bgmss_path;
  error_log /var/log/nginx/bgmss-v2-error.log warn;

  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /metrics {
    access_log off;
    return 404;
  }

  location ^~ /api/v1/images/bangumi/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_pass http://bgmss_v2_api;
  }

  location ^~ /api/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_pass http://bgmss_v2_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
