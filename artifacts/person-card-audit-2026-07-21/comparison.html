<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>人物卡片列表 · 同状态前后对照</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
				background: #0e0e12;
				color: #f6f2f5;
			}
			* { box-sizing: border-box; }
			body { margin: 0; padding: 24px; }
			h1 { margin: 0 0 8px; font-size: 24px; }
			p { margin: 0 0 20px; color: #bdb7bf; }
			.comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
			figure { margin: 0; overflow: hidden; border: 1px solid #343038; border-radius: 12px; background: #17161b; }
			figcaption { padding: 12px 14px; border-bottom: 1px solid #343038; font-weight: 700; }
			img { display: block; width: 100%; height: auto; }
			@media (max-width: 1100px) { .comparison { grid-template-columns: 1fr; } }
		</style>
	</head>
	<body>
		<h1>五人卡片列表 · 1024 × 768</h1>
		<p>同一人数、同一视口：检查卡片比例、每行容量、空位保留与连接符节奏。</p>
		<div class="comparison">
			<figure>
				<figcaption>修复前 · 2 + 2 + 1，卡片被放大</figcaption>
				<img src="02-five-people-1024-baseline.png" alt="修复前五人人物卡片布局" />
			</figure>
			<figure>
				<figcaption>修复后 · 3 + 2，末行保留一个空位</figcaption>
				<img src="17-five-people-1024-final.jpg" alt="修复后五人人物卡片布局" />
			</figure>
		</div>
	</body>
</html>
