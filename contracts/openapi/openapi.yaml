    "/co-star": {
      "post": {
        "operationId": "postCoStarV1",
        "summary": "Project one real pair or group co-star analysis",
        "description": "Intersects each participant's selected identities at raw Archive Subject level, then returns server-authoritative evidence, an optional group matrix, and one view-only common-work page.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CoStarRequestV1"
              }
            }
