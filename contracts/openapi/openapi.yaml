{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Bangumi Staff Statistics Shared Contracts",
    "version": "1.0.0",
    "description": "Shared query contracts, dynamic catalog, and read-only rankings endpoint.",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    }
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "Version 1 API family"
    }
  ],
  "paths": {
    "/catalog": {
      "get": {
        "operationId": "getCatalogV1",
        "summary": "Read the current dynamic position catalog",
        "description": "Returns one deterministic projection of the currently published Archive Store. The operation accepts no parameters and no request body.",
        "security": [],
        "responses": {
          "200": {
            "description": "The current catalog.",
            "headers": {
              "Cache-Control": {
                "description": "Catalog responses must be revalidated.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-cache"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CatalogSuccessEnvelopeV1"
                }
              }
            }
          },
          "400": {
            "description": "A query parameter or non-empty body was supplied.",
            "headers": {
              "Cache-Control": {
                "description": "Errors must not be cached.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelopeV1"
                }
              }
            }
          },
          "405": {
            "description": "The catalog route supports GET only.",
            "headers": {
              "Allow": {
                "description": "The only supported method.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "GET"
                }
              },
              "Cache-Control": {
                "description": "Errors must not be cached.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelopeV1"
                }
              }
            }
          },
          "500": {
            "description": "The published catalog is corrupt or projection failed.",
            "headers": {
              "Cache-Control": {
                "description": "Errors must not be cached.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelopeV1"
                }
              }
            }
          },
          "503": {
            "description": "No Archive Store has been published.",
            "headers": {
              "Cache-Control": {
                "description": "Errors must not be cached.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelopeV1"
                }
              }
            }
          },
          "504": {
            "description": "The request deadline elapsed before a response was committed.",
            "headers": {
              "Cache-Control": {
                "description": "Errors must not be cached.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              },
              "X-Request-ID": {
                "description": "Opaque request correlation identifier.",
                "required": true,
                "schema": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelopeV1"
                }
              }
            }
          }
        }
      }
    },
    "/rankings": {
      "post": {
        "operationId": "postRankingsV1",
        "summary": "Project one immutable query result into a rankings page",
        "description": "Evaluates one personal or global shared query and projects a deterministic ranked page. Search, sort, order, and pagination are view-only.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RankingsRequestV1"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The complete-core summary and requested rankings page.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RankingsSuccessEnvelopeV1"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ResultBadRequestErrorV1"
          },
          "403": {
            "$ref": "#/components/responses/ResultForbiddenErrorV1"
          },
          "404": {
            "$ref": "#/components/responses/ResultNotFoundErrorV1"
          },
          "405": {
            "$ref": "#/components/responses/ResultMethodNotAllowedErrorV1"
          },
          "413": {
            "$ref": "#/components/responses/ResultPayloadTooLargeErrorV1"
          },
          "415": {
            "$ref": "#/components/responses/ResultUnsupportedMediaTypeErrorV1"
          },
          "429": {
            "$ref": "#/components/responses/ResultRateLimitedErrorV1"
          },
          "500": {
            "$ref": "#/components/responses/ResultInternalErrorV1"
          },
          "502": {
            "$ref": "#/components/responses/ResultBadGatewayErrorV1"
          },
          "503": {
            "$ref": "#/components/responses/ResultServiceUnavailableErrorV1"
          },
          "504": {
            "$ref": "#/components/responses/ResultGatewayTimeoutErrorV1"
          }
        }
      }
    },
    "/candidates": {
      "post": {
        "operationId": "postCandidatesV1",
        "summary": "Project candidate lists for one ordered query position",
        "description": "Evaluates every ordered query position independently, returns complete position counts, and projects one deterministic ranked candidate page. Search, sort, order, and pagination are view-only.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CandidatesRequestV1"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Complete ordered position counts and the requested current-position candidate page.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CandidatesSuccessEnvelopeV1"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ResultBadRequestErrorV1"
          },
          "403": {
            "$ref": "#/components/responses/ResultForbiddenErrorV1"
          },
          "404": {
            "$ref": "#/components/responses/ResultNotFoundErrorV1"
          },
          "405": {
            "$ref": "#/components/responses/ResultMethodNotAllowedErrorV1"
          },
          "413": {
            "$ref": "#/components/responses/ResultPayloadTooLargeErrorV1"
          },
          "415": {
            "$ref": "#/components/responses/ResultUnsupportedMediaTypeErrorV1"
          },
          "429": {
            "$ref": "#/components/responses/ResultRateLimitedErrorV1"
          },
          "500": {
            "$ref": "#/components/responses/ResultInternalErrorV1"
          },
          "502": {
            "$ref": "#/components/responses/ResultBadGatewayErrorV1"
          },
          "503": {
            "$ref": "#/components/responses/ResultServiceUnavailableErrorV1"
          },
          "504": {
            "$ref": "#/components/responses/ResultGatewayTimeoutErrorV1"
          }
        }
      }
    },
    "/person-detail": {
      "post": {
        "operationId": "postPersonDetailV1",
        "summary": "Project one ranking-eligible person's complete detail evidence",
        "description": "Builds one immutable person-detail core and projects a deterministic works or characters page. Search, sort, order, and pagination are view-only; refreshCollection is never accepted.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PersonDetailRequestV1"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Complete bounded person evidence and the requested section page.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailSuccessEnvelopeV1"
                }
              }
            }
          },
          "400": {
            "description": "Invalid JSON, request shape, query, view, person eligibility, or field value.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "403": {
            "description": "The requested collection is not public.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "404": {
            "description": "The requested user or person does not exist.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "405": {
            "description": "The person-detail route supports POST only.",
            "headers": {
              "Allow": {
                "description": "The only supported method.",
                "required": true,
                "schema": {
                  "type": "string",
                  "const": "POST"
                }
              },
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "413": {
            "description": "The request exceeds the transport limit.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "415": {
            "description": "The request media type is unsupported.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "429": {
            "description": "The caller has exceeded the collection request rate.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              },
              "Retry-After": {
                "description": "Bounded delay before another request.",
                "required": true,
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "500": {
            "description": "An unexpected internal failure occurred.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "502": {
            "description": "The upstream returned an invalid protocol response.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "503": {
            "description": "The service is busy, not ready, or an upstream is unavailable.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              },
              "Retry-After": {
                "description": "Delay before retrying when a bounded wait is known.",
                "required": false,
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          },
          "504": {
            "description": "The request or upstream operation timed out.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/PrivateNoStoreV1"
              },
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestIDV1"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PersonDetailErrorEnvelopeV1"
                }
              }
            }
          }
        }
      }
    },
    "/partners": {
      "post": {
        "operationId": "postPartnersV1",
        "summary": "Project real shared-work partners for one source person",
        "description": "Finds partners who share real raw Archive Subjects with the selected source identities, then projects deterministic fixed leaders and a view-only page.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PartnersRequestV1"
